name: Deploy to GitHub Pages (branch fallback)

# Manual only. Nothing triggers this on a push.
#
# Use it when deploy.yml is stuck. On 6 Aug 2026 the deploy job in deploy.yml
# failed twice in a row with "Timeout reached, aborting!" after ten minutes,
# while the build job passed in twenty seconds. That is actions/deploy-pages
# creating a Pages deployment and then polling for a status that never arrives.
#
# This workflow does not touch the Pages deployment API at all. It builds the
# site and force-pushes the result to a gh-pages branch, which GitHub Pages can
# serve directly.
#
# To use it: Settings > Pages > Build and deployment > Source > Deploy from a
# branch, branch gh-pages, folder / (root). Then run this workflow from the
# Actions tab. Switching the source back to GitHub Actions returns to deploy.yml.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-fallback
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm install

      - run: npx @11ty/eleventy
        env:
          NODE_ENV: production
          PATH_PREFIX: /Natural-Trace-Website/

      # A branch-served Pages site is run through Jekyll unless this file is
      # present, and Jekyll silently drops every directory starting with an
      # underscore. deploy.yml does not need this; a branch deploy does.
      - run: touch _site/.nojekyll

      - name: Push the built site to gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Health check

# Runs on every push, and weekly on its own so problems that appear without a
# code change — a dead outbound link, an expired partner site — surface anyway.
# A failed scheduled run emails whoever owns the repository.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * 1"   # Mondays, 01:00 UTC (09:00 Singapore)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # Every job gets a ceiling. The deploy that ran for 3h40m on 11 Aug
    # had none, and that is what turned a failure into an outage.
    timeout-minutes: 15
    steps:
      # Pinned to v6 on 11 Aug 2026. v4 declares runs.using: node20, which
      # GitHub deprecated and is already force-running on node24, with a
      # warning on every build. Confirmed from action.yml at the v6 tag on both
      # actions: runs.using is node24, so this is the version that stops being
      # forced. The forcing is a warning today and will not be forever.
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm install

      - name: Build
        run: npx @11ty/eleventy

      - name: Check pages, links, SEO and structured data
        run: node scripts/healthcheck.mjs _site

      # Catches the admin panel drifting away from the data it edits: a field
      # offered in the panel that no longer exists in the file would silently
      # write a key nothing reads. Also lists anything not editable from the
      # panel, which does not fail the build but is worth seeing.
      - name: Check the admin panel matches the data files
        run: node scripts/cms-audit.mjs

      # The register is the only durable record of which published phrases have
      # not been signed off, because the CMS deletes YAML comments and the
      # markers that used to sit beside the claims are gone. Until now it was
      # enforced by `npm run check`, which runs on one laptop. That is the wrong
      # place: the edits most likely to reword a flagged claim arrive from the
      # CMS as a pull request nobody checks out. On 19 August a heading on
      # /assess/ was rewritten that way, reached the live site, and was caught
      # by hand hours later. Running it here is what makes "a reworded claim is
      # a new claim" true for everyone, not just for whoever remembers.
      #
      # This does not fail on open claims. There are always some, and whether a
      # claim has been signed off is a commercial decision rather than a build
      # error. It fails only when the register and the site disagree, which
      # always means a person needs to look. No count here on purpose: the
      # number moves every time a claim is added, and a stale figure in a
      # comment is worse than none.
      - name: Check published claims still match the register
        run: node scripts/claim-check.mjs

      # The compatibility quiz answer key: all 1,088 answer combinations and the
      # outcome each one reaches, lifted from verdict() in main.js as source
      # text and run against assess.yml, so it cannot drift from the real logic.
      #
      # Generated here rather than committed. A Decap publish writes exactly one
      # file — src/_data/assess.yml — and has no idea a derived artifact exists,
      # so a checked-in copy would silently disagree with its own source the
      # first time anyone edits the quiz through the CMS. Not a merge conflict,
      # which would at least be loud, but a file that still opens, still shows
      # 1,088 rows, and is quietly wrong. Building it on every run means it is
      # always current, and means Alrik and Ying Xiang can read it without
      # running a Node script, which matters while the four scoring decisions
      # are still open.
      #
      # Deliberately NOT built into _site. GitHub Pages serves that publicly and
      # this exposes the full scoring thresholds and the outcome distribution.
      - name: Build the compatibility quiz answer key
        run: node scripts/assess-matrix.mjs

      # Pinned to v7 for the same reason checkout and setup-node are pinned to
      # v6: v4 declares runs.using node20, which GitHub deprecated and is
      # already force-running on node24. Confirmed from action.yml at the v7
      # tag: runs.using is node24.
      - name: Attach the answer key to this run
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-quiz-answer-key
          path: docs/assess-matrix.html
          retention-days: 90

      # Without this the artifact is real but undiscoverable: nothing on the run
      # page says what it is or why anyone would want it.
      - name: Say where the answer key is
        run: |
          {
            echo "### Compatibility quiz answer key"
            echo ""
            echo "Every one of the 1,088 answer combinations and the outcome it reaches,"
            echo "regenerated from this commit. Download it from the **Artifacts** section"
            echo "at the bottom of this run, as \`compatibility-quiz-answer-key\`."
            echo ""
            echo "It is not committed to the repository and not published on the site."
            echo "Regenerate locally with \`node scripts/assess-matrix.mjs\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Outbound links are only checked on the schedule and on demand, so a
      # third party being briefly down cannot block a deploy.
      - name: Check outbound links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/healthcheck.mjs _site --external

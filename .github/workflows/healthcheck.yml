name: Health check

# Runs on every push, and weekly on its own so problems that appear without a
# code change — a dead outbound link, an expired partner site — surface anyway.
# A failed scheduled run emails whoever owns the repository.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * 1"   # Mondays, 01:00 UTC (09:00 Singapore)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # Every job gets a ceiling. The deploy that ran for 3h40m on 11 Aug
    # had none, and that is what turned a failure into an outage.
    timeout-minutes: 15
    steps:
      # Pinned to v6 on 11 Aug 2026. v4 declares runs.using: node20, which
      # GitHub deprecated and is already force-running on node24, with a
      # warning on every build. Confirmed from action.yml at the v6 tag on both
      # actions: runs.using is node24, so this is the version that stops being
      # forced. The forcing is a warning today and will not be forever.
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm install

      - name: Build
        run: npx @11ty/eleventy

      - name: Check pages, links, SEO and structured data
        run: node scripts/healthcheck.mjs _site

      # Catches the admin panel drifting away from the data it edits: a field
      # offered in the panel that no longer exists in the file would silently
      # write a key nothing reads. Also lists anything not editable from the
      # panel, which does not fail the build but is worth seeing.
      - name: Check the admin panel matches the data files
        run: node scripts/cms-audit.mjs

      # Outbound links are only checked on the schedule and on demand, so a
      # third party being briefly down cannot block a deploy.
      - name: Check outbound links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/healthcheck.mjs _site --external

name: Deploy to GitHub Pages

# Publishes the site by pushing the built files to a gh-pages branch, which
# GitHub Pages serves directly.
#
# This replaced the artifact-and-deployment-API route on 11 Aug 2026. Both are
# called "GitHub Pages" and they are not the same mechanism:
#
#   Branch route   the workflow runs `git push`. GitHub notices the branch
#                  changed and copies the files to its CDN. One moving part,
#                  and it is ordinary git.
#
#   Actions route  the workflow uploads the site as an artifact, calls the
#                  Pages deployment API to create a deployment, then polls that
#                  API waiting for a status. Three moving parts, two of them
#                  specific to Pages.
#
# The Actions route hung twice. On 6 Aug 2026 it aborted after ten minutes with
# "Timeout reached", caused by a missing actions: read permission. On 11 Aug it
# hung for over three and a half hours with no timeout at all, with that
# permission in place, and blocked every later deploy because the concurrency
# group would not release. The build job passed in thirteen seconds both times.
# Only the step that talks to the deployment API ever failed.
#
# So this is not a workaround kept until the real one is fixed. It is the route
# with fewer things in it that can fail, doing the same job. The old workflow is
# preserved as deploy-actions-api.yml.disabled if it is ever wanted back; see
# the note at the top of that file for how to switch.
#
# Repo setting this depends on:
#   Settings > Pages > Source > Deploy from a branch, branch gh-pages, / (root)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Latest push wins. A superseded run is force-pushing an older build over a
# newer one, so cancelling it is not just an optimisation, it prevents the
# site going backwards when two commits land close together.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Nothing here should take five minutes. The reason this exists at all is
    # that a job with no timeout ran for 3h40m and held the queue shut behind
    # it. A deploy that is going to fail should fail while someone is still
    # looking at it.
    timeout-minutes: 10

    steps:
      # Pinned to v6. v4 declares runs.using: node20, which GitHub deprecated
      # and is already force-running on node24, with a warning on every build.
      # Confirmed from action.yml at the v6 tag: runs.using is node24.
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm install

      - run: npx @11ty/eleventy
        env:
          NODE_ENV: production
          PATH_PREFIX: /

      # A branch-served Pages site is run through Jekyll unless this file is
      # present, and Jekyll silently drops every directory starting with an
      # underscore. The artifact route did not need this; a branch deploy does.
      # Without it the site builds, deploys, and quietly loses pages.
      - run: touch _site/.nojekyll

      # Fail loudly rather than publishing an empty site. If the build produced
      # nothing, force-pushing that over a working site is worse than not
      # deploying at all.
      - name: Check the build produced something
        run: |
          test -f _site/index.html || { echo "No _site/index.html, refusing to publish"; exit 1; }
          count=$(find _site -name 'index.html' | wc -l)
          echo "$count pages built"
          test "$count" -gt 20 || { echo "Only $count pages, expected more than 20, refusing to publish"; exit 1; }

      - name: Push the built site to gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

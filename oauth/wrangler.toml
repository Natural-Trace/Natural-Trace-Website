name = "natural-trace-cms-auth"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# Public. This is the Client ID of the GitHub OAuth App, not a secret.
GITHUB_CLIENT_ID = "Ov23liBrjVszAH9CI7PP"

# Only these origins may receive a token. Keep this tight. Add the production
# domain at cutover and remove anything that is no longer used.
# http://localhost:8080 was removed on 13 Oct 2026. Local work on the panel
# uses local_backend (see CLAUDE.md) and never comes through this Worker, so the
# entry only meant that any page served on that port could receive a token.
ALLOWED_ORIGINS = "https://natural-trace.com,https://natural-trace.github.io"

# GITHUB_CLIENT_SECRET is deliberately absent. It is set once with
#   wrangler secret put GITHUB_CLIENT_SECRET
# and lives in Cloudflare, never in this file and never in git.

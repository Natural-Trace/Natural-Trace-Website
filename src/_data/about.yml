# Our Story
story_label: "Our Story"
story_title: "From a Simple Question<br>to a New Approach"
story_question: "What happens to an ingredient's identity once it leaves the control of the company that created it?"
story_body:
  - "Behind every differentiated ingredient is significant investment in research, formulation, manufacturing, intellectual property, and customer trust. Yet once that ingredient enters a wider production network, proving that it is still present, and distinguishing it from generic alternatives, can become increasingly difficult."
  - "That challenge inspired Natural Trace."
  - "Founded in Singapore in 2021, Natural Trace set out to create a new approach to authentication: one in which a unique, verifiable identity is incorporated directly into the ingredient."
  - "Today, our technology helps companies protect their ingredients, verify manufacturing sources, and investigate products when identity or presence is questioned."

# Why We Exist
why_label: "Why We Exist"
why_title: "Science that Protects Commercial Value"
# The background photograph, tinted the way the homepage hero is tinted rather
# than laid down raw: the section is white text on a dark field and a bright
# sky behind it would take the contrast below readable. Clearing this field
# returns the section to the flat charcoal it had before, which is what the
# 11 August meeting asked for, so the two requests can both be honoured
# without a developer.
why_bg_image: "/assets/images/kirsty/vision.webp"
why_body:
  - "Global supply chains have become increasingly complex. Documentation records what should have happened. Natural Trace adds evidence that proves it."
  - "We exist to help companies protect the value behind differentiated ingredients through objective, science-based verification."
  - "By combining in-product identity with proprietary laboratory detection, Natural Trace gives businesses an additional way to protect intellectual property, strengthen manufacturing control, and support confidence across commercial relationships."


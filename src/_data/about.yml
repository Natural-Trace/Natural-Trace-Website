# Our Story
story_label: "Our Story"
story_title: "From a Simple Question<br>to a New Approach"
story_question: "What happens to an ingredient's identity once it leaves the control of the company that created it?"
story_body:
  - "Behind every differentiated ingredient is significant investment in research, formulation, manufacturing, intellectual property, and customer trust. Yet once that ingredient enters a wider production network, proving that it is still present, and distinguishing it from generic alternatives, can become increasingly difficult."
  - "That challenge inspired Natural Trace."
  - "Founded in Singapore in 2021, Natural Trace set out to create a new approach to authentication: one in which a unique, verifiable identity is incorporated directly into the ingredient."
  - "Today, our technology helps companies protect their ingredients, verify manufacturing sources, and investigate products when identity or presence is questioned."

# Why We Exist
why_label: "Why We Exist"
why_title: "Science that Protects Commercial Value"
why_body:
  - "Global supply chains have become increasingly complex. Documentation records what should have happened. Natural Trace adds evidence that proves it."
  - "We exist to help companies protect the value behind differentiated ingredients through objective, science-based verification."
  - "By combining in-product identity with proprietary laboratory detection, Natural Trace gives businesses an additional way to protect intellectual property, strengthen manufacturing control, and support confidence across commercial relationships."

# Vision & Mission
vision_label: "Our Vision"
vision_text: "A world where every great product comes with a trusted provenance story"
mission_label: "Our Mission"
mission_text: "To become the global leader for in-product authentication for food and nutraceutical ingredients."
mission_body: "By making authentication practical and commercially scalable, we help businesses protect premium ingredients, verify authorised manufacturing and build trust throughout global supply chains."

# What Makes Us Different
different_label: "What Makes Us Different"
different_title: ""   # blank on purpose: it repeated the first card below
different_cards:
  - title: "Identity Built into the Ingredient"
    body: "Traditional authentication relies on packaging, labels or paperwork that can become separated from the product. NaturalTag™ becomes part of the ingredient itself, allowing identity to travel with the product throughout manufacturing and distribution."
  - title: "Branded Ingredient Differentiation"
    body: "Many premium ingredients become difficult to distinguish once incorporated into finished products. Natural Trace gives ingredients a unique, detectable identity that allows companies to objectively verify the presence of their branded ingredient downstream."
  - title: "Downstream Verification"
    body: "Conventional analytical testing can confirm chemical composition but often cannot verify the specific commercial source of an ingredient. Natural Trace enables objective verification of authorised ingredients throughout the supply chain using proprietary detection methods."
  - title: "Production-Source Identification"
    body: "Knowing what is in a product is only part of the picture. Natural Trace can help distinguish authorised manufacturing from unauthorised production by assigning unique authentication identities to approved manufacturing sources."


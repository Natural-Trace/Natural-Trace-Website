# Hero
label: "About Natural Trace"
# The break is set here rather than left to the browser. Balanced wrapping was
# putting a long line between two short ones, which is the shape Bryan flagged
# on 12 Aug. Two lines with the noun phrase kept whole reads as a decision;
# whatever the algorithm picks at a given window width does not. The <br> is
# suppressed below 700px, where the column is too narrow to honour it.
title: "Protecting the Future of<br>Premium Ingredients"
# Kirsty's two requests for this line: same weight and colour as the text
# around it, and do not let it split over two lines.
#
# The first was already true and is now true again: it is 400 weight in
# #2C3345, the same as the paragraph beneath it. The bold sage "authenticity"
# that sat here on 12 Aug has been taken out.
#
# The second needed three words cut. Measured: the sentence set 508px, and the
# narrowest this column ever gets while the hero is still two columns is 450px,
# at a 1000px window. "be able to" is the only part of the sentence carrying no
# meaning, and without it the line sets 426px, so it holds one line at every
# desktop width with 24px to spare. On a phone the column is 281px and no
# sentence of this length fits on one line at any readable size, so it wraps
# there; the non-breaking space keeps "prove its" together so "its" cannot end
# up alone at the start of the second line.
#
# Putting "be able to" back will bring the two-line split back with it.

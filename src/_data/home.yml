# Home page content: Clean Prototype Copy Guide 2026
# Editable via Decap CMS or directly

# Hero Section
# The hero background. Tinted into the brand navy by CSS, so anything put here
# will come out navy whatever colour it starts as. Landscape, 1600px wide or
# more. A busy or bright picture is fine, the tint handles it.
hero_bg_image: "/assets/images/ingredients-lab.webp"
# Decorative, so the alt text is not rendered. Kept as a description of what
# the picture is, for whoever picks the next one.
hero_bg_image_alt: "Berries, botanicals and powders on a bench in a food laboratory"
hero_image: "/assets/images/home-hero-product.webp"
hero_image_alt: "Botanical powder, capsules and an unlabelled supplement bottle, the powder marked with the Natural Trace leaf"
hero_title_line1: "Protect the Ingredients"
hero_title_line2: "Behind Your Brand"
# Positioning statement, verbatim from the copy guide. Do not shorten without
# Kirsty's sign-off. Rendered in bold at the start of the hero lead paragraph,
# directly under the headline.
# The ampersand is bound to the words either side of it, the same rule the
# "Why Customers Choose" card headings follow: an ampersand joins two things
# and is not left at the end of a line holding one of them. Without this the
# line broke as "…for Food & / Nutraceutical Ingredients." on a phone. The
# words are unchanged; &amp; is only how a bare & is written once the field
# goes through the safe filter.
hero_slogan: "In-Product Authentication for Food&nbsp;&amp;&nbsp;Nutraceutical Ingredients"
hero_desc: "Natural Trace gives every ingredient a unique, detectable identity, verifiable throughout the supply chain."
# Rendered as a single sentence: items joined with commas and "and", then the
# coda after a comma. Kirsty wrote these as five short lines; the fifth is a
# coda, not a peer, which is why it read as an orphan when set as a list.
# These read as a ticked list now rather than one running sentence, so each one
# starts with a capital. The wording is unchanged: the mockup says "Investigate
# Counterfeit Products", which is a stronger claim than "suspicious", and that
# is not a change to make without asking.
hero_claims:
  - "Verify presence"
  - "Protect branded ingredients"
  - "Confirm authorised manufacturing"
  - "Investigate suspicious products"
# Emptied on Kirsty's 12 Aug request. It used to trail the four ticks as
# "...all through the supply chain", saying the same thing the description
# above now says in a full sentence. The template only renders this line
# when it has a value, so an empty string removes it cleanly and it can be
# brought back from the panel without touching code.
hero_claims_coda: ""
hero_cta: "Request a Compatibility Assessment"
hero_cta_url: "/contact/"
hero_cta_secondary: "How it works"
hero_cta_secondary_url: "#how-it-works"

# Section 2: The Challenge
challenge_label: "The Challenge"
challenge_title: "Your Product is Unique. Can You Prove It's Yours?"
challenge_lead: "Traditional ingredient and botanical testing can be inconclusive. Packaging can be replaced. Documentation can be copied. Certificates can be separated from the product. Natural Trace incorporates authentication directly into the product itself, so proof remains with it throughout its journey."
challenge_list_label: "Why Authentication Matters Today"
challenge_list:
  - "Ingredients can be difficult to verify after production."
  - "Global supply chains are becoming more complex."
  - "Premium ingredients are increasingly targeted for substitution and misuse."
  - "Brand owners need confidence beyond documentation."
  - "Customers and regulators expect stronger proof of authenticity."
  - "Manufacturing networks are expanding globally."
challenge_close: "Natural Trace incorporates a detectable authentication tag directly into the product, allowing proof of authenticity to travel wherever your product goes."
challenge_image: "https://images.unsplash.com/photo-1710141530542-f792450e736e?w=900&q=80"
challenge_image_alt: "Bulk ingredient sacks stacked in a distribution warehouse"

# Section 3: Value Proposition
vp_label: "Our Value"
vp_title: "Proof That Travels With Your Ingredients"
vp_subtitle: "Independent, scientific evidence that confirms what's really in your supply chain, not just what the paperwork says."
vp_value_label: "Our value"
vp_cards:
  - title: "Verify Ingredient Authenticity"
    icon: "target"
    problem: "Ingredients can be substituted, diluted, adulterated, or falsely labelled before they reach you."
    value: "Confirm an ingredient or finished product is genuine by detecting its embedded identity, not just its label."
  - title: "Confirm Authorized Manufacturing"
    icon: "factory"
    problem: "Contract manufacturers may overproduce, substitute materials, use undeclared facilities, or divert product into unauthorized channels."
    value: "Verify what was actually produced, with which materials, by which authorized partner, and that production stayed within the approved process."
  - title: "Verify Origin, Beyond Paperwork"
    icon: "origin"
    problem: "Documents can be lost, altered, or disconnected from the physical product as it moves through the supply chain."
    value: "Confirm the true origin, custody, movement, and destination of the physical product itself."
  - title: "Investigate with Objective Evidence"
    icon: "search"
    problem: "Suspicious or counterfeit products are hard to prove without independent, scientific proof."
    value: "Support investigations and enforcement with objective scientific evidence, not assumptions."
  - title: "Protect Brand & Commercial Value"
    icon: "shield"
    problem: "Counterfeit, diverted, or grey-market products erode revenue, reputation, and customer trust."
    value: "Distinguish genuine products from unauthorized ones and strengthen confidence across the supply chain."

# Section 4: How It Works
# Moved here from the NaturalTag page on 8 Aug. Kirsty flagged that Section 4 of
# the approved copy was missing from the homepage and that this was it.
#
# The four steps sit on one row and the detail below is a disclosure, so the
# section costs about one screen rather than four. It is a <details> element,
# not a hover: hover does not exist on a phone and cannot be reached from a
# keyboard.
how_label: "How It Works"
how_title: "Four Steps From Ingredient to Evidence"
how_steps:
  - num: "01"
    title: "Tag"
    description: "Add NaturalTag™ into your ingredient during production."
  - num: "02"
    title: "Produce"
    description: "Manufacture and distribute as normal."
  - num: "03"
    title: "Test"
    description: "Test any sample whenever authenticity is questioned."
  - num: "04"
    title: "Authenticate"
    description: "Confirm authenticity using NaturalDetect™ testing and manage results through NaturalCloud™."
how_features_label: "What that means in practice"
how_features:
  - "Invisible at recommended use levels"
  - "Food-grade authentication"
  - "No impact on product performance"
  - "Detectable even after cooking or blending into final product"
  - "Compatible with existing manufacturing"
  - "Designed for commercial scale"


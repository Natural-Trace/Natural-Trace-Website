section_label: "Contact"
title: "Contact our team"
subtitle: "Request a compatibility assessment or talk to our team about protecting a premium ingredient, verifying manufacturing partners, or investigating suspicious products."

# Countries only, no street addresses. Asked for in the 11 Aug meeting: a
# contact page that lists one office reads as a one-office company.
info_items:
  - label: "Locations"
    description: "Singapore, Switzerland, United States"
  - label: "What We Do"
    description: "In-product authentication via NaturalTag&trade; integration. We tag your product at source and verify it downstream with NaturalDetect&trade;."

form:
  title: "Send Us a Message"
  subtitle: "Fill out the form below and our team will be in touch."
  first_name_label: "First Name"
  first_name_placeholder: "Your first name"
  last_name_label: "Last Name"
  last_name_placeholder: "Your last name"
  email_label: "Email"
  email_placeholder: "your@company.com"
  company_label: "Company"
  company_placeholder: "Your company name"
  job_title_label: "Job Title"
  job_title_placeholder: "Your role"
  # The only optional field on the form. It is not labelled as such: required
  # fields carry a red asterisk and optional ones carry nothing, so Topic is
  # the one label on the form with no marker after it. Everything else is
  # required on HubSpot's side and a blank value is never sent, which makes
  # HubSpot reject the whole submission.
  inquiry_type_label: "Topic"
  inquiry_type_placeholder: "Select a topic"
  message_label: "Message"
  message_placeholder: "Tell us about your project or requirements..."
  submit_text: "Send Message"

inquiry_types:
  - value: "NaturalTag Integration"
    label: "NaturalTag&trade; Integration"
  - value: "Supply Chain Traceability"
    label: "Supply Chain Traceability"
  - value: "Partnership"
    label: "Partnership Inquiry"
  - value: "General"
    label: "General Inquiry"

success:
  title: "Message Sent"
  message: "Thank you for reaching out. Our team will review your inquiry and get back to you shortly."

# Shown when the message is handed to the visitor's email client instead of
# being submitted directly. This is the current behaviour until HubSpot is
# configured in _data/integrations.yml.
fallback:
  title: "One Last Step"
  message: "Your email client should now be open with your message ready to send. If nothing opened, email us directly at info@natural-trace.com and we will pick it up from there."

# Shown if a direct submission is attempted and fails.
error:
  title: "Message Not Sent"
  message: "Something went wrong on our side. Please email us directly at info@natural-trace.com and we will get back to you."

cta:
  section_label: "Get Started"
  title: "Start Your First Test Today"
  subtitle: "Schedule a consultation, discuss a compatibility project, or explore our testing capabilities."
  primary_text: "Contact Us"
  # Was "#contact-form", which is the whole section and therefore the top of
  # the page. Clicking it scrolled 844px up and landed on the introduction,
  # which is why it was reported as not working: it moved, but not to anything
  # the button had promised. "#contactForm" is the form itself.
  primary_href: "#contactForm"
  secondary_text: "View Services"
  secondary_href: "/naturaltag/"   # was /services/, which is only a redirect to here

# Redirects from the old natural-trace.com URLs.
#
# Enumerated from that site's WordPress sitemaps on 4 August 2026. Each rule
# builds a small noindex page at `from` that sends the visitor to `to`, so that
# nothing 404s the moment the domain points at this build. GitHub Pages has no
# server-side redirects, which is why these are real files.
#
# Old articles have not been migrated. Every post, category and tag lands on
# /insights/ rather than its own content. That is a holding position, not a
# destination: if any of them earn traffic, port the article across and point
# the rule at the real page.
#
# Add a rule here and it takes effect on the next build. No template edit.

rules:

  # Pages
  # old slug was misspelt
  - from: "/fqas/"
    to: "/faq/"
  - from: "/who-we-are/"
    to: "/team/"
  - from: "/our-story/"
    to: "/about/#story"
  # Solutions landing
  - from: "/our-products/"
    to: "/naturaltag/"
  - from: "/what-we-do/how-it-works/"
    to: "/naturaltag/#how-it-works"
  - from: "/resources/"
    to: "/insights/"
  - from: "/contact-us/"
    to: "/contact/"
  - from: "/privacy-policy/"
    to: "/privacy/"
  # TODO: the new site has no Terms of Use page. Pointing at the privacy policy is a stopgap.
  - from: "/terms-of-use/"
    to: "/privacy/"
  # stray page indexed on the old site
  - from: "/default-final/"
    to: "/"
  # stray page indexed on the old site
  - from: "/test-page-1/"
    to: "/"

  # Articles: not yet migrated, all land on the Insights index
  - from: "/dietary-supplement-recalls-tackling-fraud-counterfeits-and-fake-ingredients/"
    to: "/insights/2024-06-26-dietary-supplement-recalls-tackling-fraud-counterfeits-and-fake-ingredients/"
  - from: "/views-from-natural-trace-rise-in-food-fraud-suspicions/"
    to: "/insights/2024-05-02-views-from-natural-trace-rise-in-food-fraud-suspicions/"

# Edited through the CMS ("Event QR pages"), which deletes every comment in
# this file on save. Why the copy says what it says: docs/qr-scan-tracking.md.
#
# One page, one QR code, from 24 Aug 2026. It was a page per jar until then.
#
# Both jars hold the same powder from 25 Aug 2026, so the two piles really are
# alike. The copy may say so now. It could not before, and the reason that rule
# existed is still in the docs, because the props can change back.
#
# Register: measured and professional. This is read by buyers and IP counsel at
# a conference, not by a consumer. No NaturalDetect and no assay detail here on
# purpose; the visitor needs the proposition, not the method.
#
# The page states which jar is which at the top, on purpose. The printed stand
# card already shows a tick against one jar and a cross against the other, so a
# guess staged here would be a guess the visitor had already been given the
# answer to. See docs/qr-scan-tracking.md.

opening:
  label: "The two jars on our stand"
  title: "One of these can prove where it came from"
  lead: >-
    Both are presented as the same branded protein powder. Identical in colour,
    identical in texture, identical on the label. Only one of them carries
    NaturalTag™, and that is the only reason the difference can be shown at all.
  image: /assets/images/scan-both.webp
  image_alt: "Two cones of brown powder side by side, alike in colour and texture"

reveal:
  left:
    label: "Left jar"
    image: /assets/images/scan-left.webp
    image_alt: "A cone of brown powder, from the jar on the left"
    title: "Left jar: authenticated"
    body: >-
      It carries NaturalTag™, applied at the point of manufacture. Its origin
      can be confirmed at any point in the supply chain, from the product
      itself.
  right:
    label: "Right jar"
    image: /assets/images/scan-right.webp
    image_alt: "A cone of brown powder, from the jar on the right"
    title: "Right jar: unverified"
    body: >-
      It carries no tag. It may be the branded product, or it may not. Neither
      its appearance nor its label can settle the question.

question_title: "Appearance is not evidence"
question_body: >-
  These two are identical in colour and texture. Even where powders do differ,
  the difference proves nothing on its own: shade varies between batches,
  suppliers and seasons for entirely legitimate reasons.

answer_title: "NaturalTag™ provides the evidence"
answer_body: >-
  NaturalTag™ is a food-grade tag incorporated into a product at its source. It
  allows the identity and origin of a batch to be confirmed downstream,
  independently of how the product looks.

cta_heading: "Considering NaturalTag™ for your own product?"

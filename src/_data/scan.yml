opening:
  label: "You scanned the jars on our stand"
  title: "One is malt powder. One is protein powder."
  reveal: >-
    The jar on the left holds a chocolate malt powder. The jar on the right
    holds chocolate protein powder — a different product at a different price.
    Seeing that they differ is easy. Knowing which is which is the part that
    looking cannot do.

question_title: "Which one is authentic?"
question_body: >-
  Appearance can show you that two products differ. It cannot tell you which
  one is what it claims to be — shade and texture shift between batches,
  suppliers and seasons for entirely ordinary reasons.

answer_title: "NaturalTag makes the answer testable"
answer_body: >-
  NaturalTag is a food-grade, PCR-detectable tag incorporated into a product
  at its source. Downstream, a NaturalDetect test reads that tag and confirms
  the product's identity and origin at batch level — evidence that does not
  depend on what the product looks like.

cta_heading: "Want to know if your product can carry a tag?"
cta_text: "Talk to us"
cta_url: "/contact/"

shared:
  label: "You scanned a jar on our stand"
  question_title: "Which one is authentic?"
  question_body: >-
    The two are not even the same shade of brown, and that tells you nothing.
    Shade shifts between batches, suppliers and seasons for entirely ordinary
    reasons. Appearance can show you that two things differ. It cannot tell you
    which one is what it claims to be.
  answer_title: "NaturalTag makes the answer testable"
  answer_body: >-
    NaturalTag is a food-grade, PCR-detectable tag incorporated into a product
    at its source. Downstream, a NaturalDetect test reads that tag and confirms
    the product's identity and origin at batch level — evidence that does not
    depend on what the product looks like.
  cta_heading: "Want to know if your product can carry a tag?"
  cta_text: "Talk to us"
  cta_url: "/contact/"

malt:
  title: "This jar is a chocolate malt powder"
  reveal: >-
    The left jar holds a chocolate malt powder. The jar beside it is chocolate
    protein powder — a different product at a different price. You could see
    the two were not the same. You could not have said which was which.


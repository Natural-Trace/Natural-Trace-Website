# Edited through the CMS ("Event QR pages"), which deletes every comment in
# this file on save. Why the copy says what it says: docs/qr-scan-tracking.md.
#
# One page, one QR code, from 24 Aug 2026. It was a page per jar until then.
#
# The two powders are behind a tap from 24 Aug. Nothing above the cards may
# say which jar is which, or the guess is over before it is offered.

opening:
  label: "You scanned the jars on our stand"
  title: "Which one is which?"
  lead: >-
    One of these is a chocolate malt powder. The other is chocolate protein
    powder, a different product at a different price. Have a guess, then tap
    a pile.
  image: /assets/images/scan-both.webp
  image_alt: "Two cones of brown powder side by side, one darker and redder than the other"

reveal:
  prompt: "Tap to reveal"
  left:
    image: /assets/images/scan-malt.webp
    image_alt: "A cone of dark reddish-brown powder"
    title: "Chocolate malt powder"
    body: >-
      The darker of the two. If the colour gave it away, you guessed well. But
      a guess is not evidence, and nobody can ship a guess to a customer.
  right:
    image: /assets/images/scan-protein.webp
    image_alt: "A cone of pale golden-brown powder"
    title: "Chocolate protein powder"
    body: >-
      The paler of the two, and usually the more expensive. That price gap is
      the whole motive for swapping one for the other.

question_title: "Which one is authentic?"
question_body: >-
  Appearance can show you that two products differ. It cannot tell you which
  is which. Shade and texture shift between batches, suppliers and seasons for
  entirely ordinary reasons.

answer_title: "NaturalTag makes the answer testable"
answer_body: >-
  NaturalTag is a food-grade, PCR-detectable tag incorporated into a product
  at its source. Downstream, a NaturalDetect test reads that tag and confirms
  the product's identity and origin at batch level. That evidence does not
  depend on what the product looks like.

cta_heading: "Want to know if your product can carry a tag?"
cta_text: "Talk to us"
cta_url: "/contact/"

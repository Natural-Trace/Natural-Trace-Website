# Edited through the CMS ("Event QR pages"), which deletes every comment in
# this file on save. Why the copy says what it says: docs/qr-scan-tracking.md.
#
# One page, one QR code, from 24 Aug 2026. It was a page per jar until then.
#
# Both jars hold the same powder from 25 Aug 2026, so the two piles really are
# alike. The copy may say so now. It could not before, and the reason that rule
# existed is still in the docs, because the props can change back.
#
# Nothing above the cards may say which jar is which, or the guess is over
# before it is offered.

opening:
  label: "You scanned the jars on our stand"
  title: "Which one is the real thing?"
  lead: >-
    Say both of these were sold to you as the same branded protein powder.
    Same colour, same texture, same claim on the label. Only one of them could
    prove where it came from. Tap a pile.
  image: /assets/images/scan-both.webp
  image_alt: "Two cones of brown powder side by side, alike in colour and texture"

reveal:
  prompt: "Tap to reveal"
  left:
    label: "Left jar"
    image: /assets/images/scan-left.webp
    image_alt: "A cone of brown powder, from the jar on the left"
    title: "The left jar is tagged"
    body: >-
      It is the branded product, carrying a NaturalTag™ signature added where
      the powder was made. A NaturalDetect™ test reads that signature and
      confirms the batch came from the source on the label.
  right:
    label: "Right jar"
    image: /assets/images/scan-right.webp
    image_alt: "A cone of brown powder, from the jar on the right"
    title: "The right jar is not"
    body: >-
      No tag, so there is nothing to test. It might be the branded product and
      it might be something substituted for it. Neither the powder nor the
      label will tell you which.

question_title: "Why looking never settles it"
question_body: >-
  These two are the same colour and the same texture, so there is nothing to
  compare. Even when two powders do look different, the difference on its own
  proves nothing: shade shifts between batches, suppliers and seasons for
  entirely ordinary reasons.

answer_title: "NaturalTag™ makes the answer testable"
answer_body: >-
  NaturalTag™ is a food-grade, PCR-detectable tag incorporated into a product
  at its source. Downstream, a NaturalDetect™ test reads that tag and confirms
  the product's identity and origin at batch level. That evidence does not
  depend on what the product looks like.

cta_heading: "Want to know if your product can carry a tag?"
cta_text: "Talk to us"
cta_url: "/contact/"

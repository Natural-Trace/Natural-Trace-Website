hero:
  label: "Industries"
  title: "Branded Ingredients"
  tagline: "Protect the value behind your ingredient brand through invisible product authentication and authorised manufacturing verification."
  intro: "Many premium ingredients become difficult to distinguish once incorporated into finished products. Natural Trace gives ingredients a unique, detectable identity that allows companies to objectively verify the presence of their branded ingredient downstream."

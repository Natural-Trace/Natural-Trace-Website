  primary_url: "/contact/"
  secondary_text: "Assess My Product"
  secondary_url: "/assess/"

challenge:
  title: "The Challenge"
  items:
    - "Behind every differentiated ingredient is significant investment in research, formulation, manufacturing, intellectual property, and customer trust."
    - "Once that ingredient enters a wider production network, proving that it is still present, and distinguishing it from generic alternatives, can become increasingly difficult."
    - "Documents can be lost, altered, or disconnected from the physical product as it moves through the supply chain."
    - "Contract manufacturers may overproduce, substitute materials, use undeclared facilities, or divert products into unauthorised channels."

value:
  title: "How Natural Trace Helps"
  items:
    - "Objectively verify the presence of your branded ingredient in finished products downstream."
    - "Verify what the CMO or CDMO actually produced, using which materials, and whether production remained within the authorised process."
    - "Distinguish authorised manufacturing from unauthorised production by assigning unique authentication identities to approved manufacturing sources."
    - "Confirm the origin, custody, movement, and destination of the physical product, not only its paperwork."


# Per-page SEO, keyed by URL. Edited here rather than in template front matter
# so it is reachable from the CMS. base.njk falls back to the page's own
# `summary` if a URL is missing, and to site.default_summary after that.
#
# Descriptions target 150-160 characters. Anything shorter wastes the snippet;
# anything longer is truncated by Google.
pages:
  - url: "/"
    title: "Natural Trace | In-Product Authentication for Food & Nutraceutical Ingredients"
    description: "Natural Trace gives every ingredient a unique, detectable identity. Verify presence, protect branded ingredients and confirm authorised manufacturing."
  - url: "/about/"
    title: "About Us"
    description: "Founded in Singapore in 2021, Natural Trace protects the value of premium ingredients through in-product authentication. Read our story and what drives us."
  - url: "/naturaltag/"
    title: "NaturalTag™"
    description: "NaturalTag™ is a food-grade, in-product authentication tag made from inactivated probiotics, formulated into your product during manufacturing."
  - url: "/naturaldetect/"
    title: "NaturalDetect™"
    description: "NaturalDetect™ is a proprietary PCR-based laboratory test that confirms whether a product contains the authentic NaturalTag™ signature. Book a test."
  - url: "/naturalcloud/"
    title: "NaturalCloud™"
    description: "NaturalCloud™ stores authentication records and NaturalDetect™ results, giving a centralised view of verification activity across your supply chain."
  - url: "/industries/"
    title: "Industries"
    description: "In-product authentication for nutraceuticals and dietary supplements, branded ingredients, functional foods and agri-food supply chains worldwide."
  - url: "/industries/use-cases/"
    title: "Industry Use-Cases"
    description: "How in-product authentication works in practice across dietary supplements, branded ingredients, fresh produce and green coffee supply chains."
  - url: "/faq/"
    title: "FAQ"
    description: "Answers on regulatory status, safety, manufacturing integration and downstream detection for NaturalTag™ and NaturalDetect™ authentication testing."
  - url: "/team/"
    title: "Team"
    description: "The Natural Trace team combines molecular biology, food regulatory expertise and enterprise software, backed by senior food-industry advisors."
  - url: "/careers/"
    title: "Careers"
    description: "Help build in-product authentication for food and nutraceutical ingredients. See current open roles and research internships at Natural Trace, Singapore."
  - url: "/insights/"
    title: "Insights"
    description: "Product developments, industry perspectives and company news from Natural Trace on ingredient authenticity, traceability and supply chain integrity."
  - url: "/assess/"
    title: "Assess My Product"
    description: "Check in 60 seconds whether Natural Trace is compatible with your product. Three questions on category, formulation and processing conditions."
  - url: "/contact/"
    title: "Contact"
    description: "Request a compatibility assessment or talk to the Natural Trace team about protecting a premium ingredient or investigating suspicious products."
  - url: "/privacy/"
    title: "Privacy Policy"
    description: "How Natural Trace Pte Ltd collects, uses and safeguards personal data submitted through natural-trace.com, and the choices available to you."

# Industry Use-Cases: Clean Prototype Copy Guide 2026
label: "Industry Use-Cases"
title: "Authentication in Practice"
subtitle: "Four applications of in-product authentication across supplements, branded ingredients and agri-food supply chains."

cases:
  - sector: "Dietary Supplements"
    title: "Proving Presence"
    challenge: "A supplement brand needed a way to verify that its proprietary botanical blend was present in finished products, beyond standard ingredient testing."
    solution: "NaturalTag was incorporated into the branded ingredient before manufacturing, allowing the finished product to be tested for the assigned tag."
    outcome: "The brand gained a practical way to verify the presence of its proprietary ingredient throughout the supply chain."
    image: "https://images.unsplash.com/photo-1732900293895-233f769299b3?w=800&q=80"
    image_alt: "Dietary supplement capsules"
  - sector: "Branded Ingredients"
    title: "Manufacturing Origin"
    challenge: "A branded ingredient owner wanted greater confidence that production by licensed manufacturers matched authorised volumes."
    solution: "Authorised production was tagged, enabling products to be tested and linked back to approved manufacturing."
    outcome: "The company strengthened manufacturing oversight and supported investigations when questions arose."
    image: "/assets/images/kirsty/usecase-manufacturing.webp"
    image_alt: "White supplement bottles moving along a filling line"
  - sector: "Agri-food: Fresh Produce"
    title: "Fruit Identity"
    challenge: "A premium berry farm wanted to prove the origin of its produce after it left the farm when growing under license."
    solution: "NaturalTag was applied to pre-harvest treatments, allowing fruit to be authenticated later in the supply chain."
    outcome: "The grower strengthened provenance verification and increased confidence for brand owners, customers and exporters."
    image: "/assets/images/kirsty/usecase-fruit-identity.webp"
    image_alt: "Rows of strawberry plants growing under a polytunnel"
  - sector: "Agri-food: Green Coffee"
    title: "Cross-Border Verification"
    challenge: "A coffee farm wanted to maintain confidence in product authenticity as green coffee beans passed through multiple international trading partners."
    solution: "Coffee is tagged before export, enabling samples collected overseas to be authenticated."
    outcome: "Importers, distributors and brand owners gained greater confidence in product origin throughout international supply chains."
    image: "https://images.unsplash.com/photo-1565273975921-c884f2b703df?w=800&q=80"
    image_alt: "Sacks of green coffee beans"


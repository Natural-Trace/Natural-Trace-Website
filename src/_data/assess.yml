compat_outcomes:
  compatible:
    label: Compatible
    title: Your product is a strong candidate for NaturalTag™
    body: Based on your answers, NaturalTag™ is likely to be compatible with your
      product. The next step is a compatibility assessment using your formulation
      to confirm performance and the best approach for your application.
  conditions:
    label: Potentially Compatible
    title: Your product is potentially compatible for NaturalTag™
    body: Based on your answers, NaturalTag™ may be suitable for your product.
      Some applications may require adjustments to the dose or where NaturalTag™
      is introduced into the process. A compatibility assessment will help us
      determine the best approach for your formulation.
  testing:
    label: Compatibility Assessment Recommended
    title: Let's assess your product
    body: Your formulation or conditions mean we would like to assess your product
      before confirming compatibility. Send us a sample and our team can test
      NaturalTag™ with your formulation and determine the best way forward.

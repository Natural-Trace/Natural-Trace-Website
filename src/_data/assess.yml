compat_label: Product Compatibility
compat_title: Assess My Product
compat_subtitle: Find out in 60 seconds whether Natural Trace is compatible with your product.
compat_welcome_title: Check Product Compatibility
compat_welcome_desc: Answer three quick questions about your product so we can
  understand your formulation and process conditions.
compat_welcome_cta: Check Compatibility
compat_step1_question: What type of product do you make?
compat_step2_question: How is your product formulated?
compat_step2_hint: Select all that apply
compat_step3_question: What are your processing conditions?
compat_step3_temp_label: Max Processing Temperature
compat_step3_ph_label: pH Range
compat_btn_next: Next
compat_btn_back: Back
compat_confirm_title: Thanks, we have what we need
compat_confirm_desc: Compatibility depends on your specific formulation and
  process conditions. Send this through and one of our scientists will review it
  with you.
compat_result_cta: Request a compatibility assessment
compat_result_cta_url: /contact/
compat_result_note: This is a first screen based on three answers, not a
  laboratory result. Compatibility is confirmed on your own formulation.
compat_ph_options:
  - label: pH 5 to 9
    risk: low
  - label: pH 3 to 5, or 9 to 11
    risk: medium
  - label: Below pH 3, or above pH 11
    risk: high
  - label: Not sure
    risk: medium
compat_temp_options:
  - label: Below 60°C
    risk: low
  - label: 60 to 100°C
    risk: medium
  - label: Above 100°C
    risk: high
  - label: Not sure
    risk: medium
compat_formulation_risk:
  rtd: high
  softgel: medium
  drops: medium
  tablet: low
  gummy: medium
  capsule: low
  chewable: low
  bar: medium
  powder: low
  effervescent: medium
  liquid: medium
  lozenge: high
compat_evidence_yes: We have tested a product in this category and format, and it worked.
compat_evidence_no: We have tested a product in this category and format and it
  did not work, which is why this needs a look rather than a yes.

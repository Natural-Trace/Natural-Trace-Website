# Site-wide settings: editable via Decap CMS
name: "Natural Trace"
legal_name: "Natural Trace Pte Ltd"
tagline: "In-Product Authentication for Food & Nutraceutical Ingredients"

# Canonical origin used for canonical links, Open Graph, sitemap and robots.
# Moved to the Natural-Trace organisation on 7 Aug 2026. The old
# ntbryan.github.io address is a 404 now, not a redirect, so this had to change
# with the transfer or every page would have been pointing at a dead URL.
# Change this to https://natural-trace.com when the domain is cut over.
url: "https://natural-trace.github.io/Natural-Trace-Website"

default_summary: "Natural Trace is the in-product authentication platform for food and nutraceutical ingredients. Protect branded ingredients, confirm authorised manufacturing and investigate suspicious products."

# Organisation facts, used for structured data
founding_year: "2021"
locality: "Singapore"
country: "SG"
email: "info@natural-trace.com"
logo: "/assets/logos/NT icon without logo.png"

# The watermark in the top right corner of every call-to-action panel.
# It is used as a mask, not as a picture: only the shape is taken from this
# file and the colour comes from the stylesheet, so the mark always sits
# tonally on the panel behind it whatever colour that panel is. That also
# means a flat single-colour graphic on a transparent background works and a
# photograph or a multi-colour logo does not. Clear this field to fall back to
# the plain circle.
cta_mark: "/assets/logos/NT icon without logo.png"
social:
  - "https://www.linkedin.com/company/natural-trace/"
  - "https://www.youtube.com/@naturaltrace8510"

# Search visibility holding switch.
# false = the whole site is kept out of Google and every other search engine:
#         robots.txt disallows everything and every page carries a noindex tag.
#         The site still works and anyone with the link can read it.
# Set this to true only once the copy claims are signed off. Sixteen claims are
# still flagged CLAIM REVIEW in the data files, including FDA GRAS status, ISO
# 17025, MIQE 2.0 and the sensory panel and matrix-count statements. An indexed
# claim is cached and quotable; a retraction is not.
search_indexable: false

# Crawler policy
# AI assistants are a route to discovery for a category most buyers cannot name
# yet, so the answer engines are allowed. Set allow_ai_crawlers to false to
# block them instead.
allow_ai_crawlers: true

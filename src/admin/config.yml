# Decap CMS Configuration for Natural Trace Website
# Content model matches the Clean Prototype Website Copy Guide 2026.
# Documentation: https://decapcms.org/docs/configuration-options/

# Authentication. Changed from git-gateway on 7 Aug 2026.
#
# git-gateway is a Netlify service and Netlify has deprecated it. It also only
# ever worked on the Netlify URL: on GitHub Pages the /admin page loaded and then
# could not log anyone in, because the /.netlify/identity endpoint it needs does
# not exist there.
#
# The GitHub backend talks to GitHub directly. The one thing a browser cannot do
# is exchange the login code for a token, because that needs a client secret, so
# base_url points at a small handler we run ourselves. Source is in oauth/,
# setup is in docs/cms-auth-setup.md.
#
# repo must be updated when this repository moves to a company organisation.
# base_url must be updated once the handler is deployed; until then, login fails.
backend:
  name: github
  repo: Natural-Trace/Natural-Trace-Website
  branch: main
  base_url: https://natural-trace-cms-auth.natural-trace.workers.dev
  auth_endpoint: auth

# Branding. `logo` is the only appearance setting Decap supports; everything
# else about how this panel looks is in admin/theme.css.
# https://decapcms.org/docs/configuration-options/#logo
#
# The paths are relative to /admin/, so they survive the site moving to a
# custom domain. The white wordmark is used because both the login screen and
# the header are dark (see theme.css).
logo:
  src: "../assets/logos/NT-logo-white.png"
  show_in_header: true

# site_url puts a "back to site" link on the login screen. display_url puts the
# site address in the header while logged in, so an editor always has one click
# back to what they are editing.
# https://decapcms.org/docs/configuration-options/#site-url
site_url: "https://natural-trace.com"
display_url: "https://natural-trace.com"
locale: "en"

media_folder: "src/assets/images/uploads"
public_folder: "/assets/images/uploads"

publish_mode: editorial_workflow

collections:
  # The sidebar mirrors the website navigation: Home, About, Solutions,
  # Industries, Insights, then Contact and the settings. A group opens to
  # the same pages its menu holds on the site, so Solutions lists
  # NaturalTag, NaturalDetect, NaturalCloud and FAQ exactly like the nav
  # dropdown. Decap has no expandable tree in the sidebar itself; one
  # level of grouping is the deepest the pinned version goes.
  #
  # File entries keep their original names and paths, so the entry named
  # "home" still edits src/_data/home.yml wherever it sits.

  # ── Home ─────────────────────────────────────────────────────────────
  #
  # Eight object fields, one per band of the page, numbered in the order a
  # visitor scrolls past them.
  #
  # Until 20 Aug this was forty-one fields in one flat list. The hero was
  # fourteen of them, and there was nothing between "Hero Claims Closing
  # Phrase" and "Challenge: Label" to say that a new part of the page had
  # started. The only grouping was a prefix typed into each label by hand —
  # "Challenge:", "Value Prop:" — which the hero fields did not carry at all,
  # so the panel opened on fourteen boxes with nothing to say what part of the
  # page they controlled.
  #
  # The numbers are the point of the change. "3. Why Customers Choose Us"
  # tells an editor where on the page they are about to change something,
  # without opening the site and counting sections. If the page order ever
  # changes, renumber these in the same commit: numbers that lie are worse
  # than no numbers.
  #
  # All eight start collapsed, so the panel opens as a contents page rather
  # than a scroll. Opening one is a single click; finding the right field in a
  # list of forty-one was not.
  #
  # The hints below are the durable copy of anything an editor needs while
  # typing. Decap never writes this file — it only reads it — so a hint here
  # survives a save, and a comment in home.yml does not. Why the wording is what
  # it is, and who asked for it, is in docs/content-decisions.md.
  - name: "home"
    label: "Home"
    files:
      # HOME
      - name: "home"
        label: "Home"
        file: "src/_data/home.yml"
        fields:

          - label: "1. Hero — the opening screen"
            name: "hero"
            widget: "object"
            collapsed: true
            hint: "The first screen a visitor sees: headline, positioning line, the ticked claims and the two buttons."
            fields:
              - {label: "Background image", name: "bg_image", widget: "image", hint: "Tinted to the brand navy by CSS, so it comes out navy whatever colour it starts as. Landscape, 1600px wide or more. A busy or bright picture is fine, the tint handles it."}
              - {label: "Background image description", name: "bg_image_alt", widget: "string", hint: "Not displayed and not read aloud — the background is decorative, so screen readers skip it. Kept as a note of what the picture shows, for whoever chooses the next one."}
              - {label: "Product image", name: "image", widget: "image", hint: "The picture beside the headline."}
              - {label: "Product image description", name: "image_alt", widget: "string", hint: "Read aloud by screen readers and shown if the image fails to load. Describe what is in it."}
              - {label: "Headline, first line", name: "title_line1", widget: "string"}
              - {label: "Headline, second line (italic)", name: "title_line2", widget: "string"}
              - {label: "Positioning line", name: "slogan", widget: "string", hint: "Shown in bold on its own line above the description. Verbatim from the copy guide — do not shorten it without Kirsty's sign-off. Write the ampersand as &amp; with &nbsp; either side, so it cannot be left stranded at the end of a line on a phone."}
              - {label: "Description", name: "desc", widget: "text"}
              - {label: "Ticked claims", name: "claims", widget: "list", field: {label: "Claim", name: "claim", widget: "string"}, hint: "Shown as a ticked list, so start each one with a capital."}
              - {label: "Closing phrase after the claims", name: "claims_coda", widget: "string", required: false, hint: "Deliberately empty since 12 Aug — it used to repeat what the description already says. The line disappears when this is empty and comes back when it is filled, with no code change."}
              - {label: "Primary button text", name: "cta", widget: "string"}
              - label: "Primary button link"
                name: "cta_url"
                widget: "string"
                pattern: ['^(/|https?://|mailto:|tel:|#)', 'Start with / for a page on this site, for example /contact/. Use https:// for another site, # for a spot on the same page, or mailto: for an email address.']
                hint: "A page on this site starts with a slash and ends with one, like /contact/. Anything else needs its full address starting https://."
              - {label: "Secondary button text", name: "cta_secondary", widget: "string"}
              - label: "Secondary button link"
                name: "cta_secondary_url"
                widget: "string"
                pattern: ['^(/|https?://|mailto:|tel:|#)', 'Start with / for a page on this site, for example /contact/. Use https:// for another site, # for a spot on the same page, or mailto: for an email address.']
                hint: "A page on this site starts with a slash and ends with one, like /contact/. Anything else needs its full address starting https://."

          - label: "2. The Challenge"
            name: "challenge"
            widget: "object"
            collapsed: true
            hint: "The band directly under the hero that states the problem, as three points side by side."
            fields:
              - {label: "Small label above the headline", name: "label", widget: "string"}
              - {label: "Headline", name: "title", widget: "string", hint: "Type <br> where you want the headline to break onto a new line."}
              - {label: "Subtitle", name: "subtitle", widget: "text", required: false}
              - label: "Points"
                name: "points"
                widget: "list"
                summary: "{{fields.text}}"
                hint: "Three reads best. They sit side by side, so keep each one to a single short sentence."
                fields:
                  - {label: "Point", name: "text", widget: "text"}
                  - {label: "Icon", name: "icon", widget: "select", options: ["document", "microscope", "question"], hint: "document is a certificate, microscope is laboratory testing, question is the turn."}
                  - {label: "Highlight this one", name: "emphasis", widget: "boolean", required: false, default: false, hint: "Fills the circle and colours the text. Use it on one point only: two highlighted points is the same as none."}

          - label: "3. Why Customers Choose Us"
            name: "value_prop"
            widget: "object"
            collapsed: true
            hint: "The card grid answering the challenge above. Each card pairs a customer problem with what Natural Trace does about it."
            fields:
              - {label: "Small label above the headline", name: "label", widget: "string"}
              - {label: "Headline", name: "title", widget: "string"}
              - {label: "Subcopy", name: "subtitle", widget: "text"}
              - {label: "Wording above the value half of each card", name: "value_label", widget: "string", hint: "Printed on every card, above the lower half. Changing it here changes it on all of them."}
              - label: "Cards"
                name: "cards"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - {label: "Card title", name: "title", widget: "string"}
                  - {label: "Card image", name: "image", widget: "image", required: false, hint: "Sits across the top of the card and is cropped to a wide banner, so a landscape picture works best. Leave it empty and the icon below is shown instead."}
                  - {label: "Card image description", name: "image_alt", widget: "string", required: false, hint: "For screen readers and for when the picture fails to load. Describe what is in it."}
                  - {label: "Icon", name: "icon", widget: "select", options: ["target", "factory", "origin", "search", "shield"], hint: "Only used when the card has no image. target is a bullseye, origin is a diamond, search is a magnifying glass."}
                  - {label: "Customer problem", name: "problem", widget: "text", hint: "Shown without a label above it, so write it as a sentence that reads as the problem."}
                  - {label: "Our value", name: "value", widget: "text"}

          - label: "4. How It Works"
            name: "how_it_works"
            widget: "object"
            collapsed: true
            hint: "The numbered steps. This section also appears on the NaturalTag page, built from these same words, so editing it here changes both places."
            fields:
              - {label: "Small label above the headline", name: "label", widget: "string"}
              - {label: "Headline", name: "title", widget: "string"}
              - label: "Steps"
                name: "steps"
                widget: "list"
                label_singular: "step"
                collapsed: true
                summary: "{{fields.num}} {{fields.title}}"
                fields:
                  - {label: "Number", name: "num", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}
              - {label: "Detail link text", name: "features_label", widget: "string", hint: "The line a visitor clicks to open the list below it."}
              - {label: "Detail points", name: "features", widget: "list", field: {label: "Point", name: "point", widget: "string"}}

          - label: "5. Industries"
            name: "industries"
            widget: "object"
            collapsed: true
            hint: "The tiles linking out to the industry pages."
            fields:
              - {label: "Small label above the headline", name: "label", widget: "string"}
              - {label: "Headline", name: "title", widget: "text"}
              - label: "Tiles"
                name: "tiles"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}
                  - {label: "Image", name: "image", widget: "image"}
                  - {label: "Image description", name: "image_alt", widget: "string", hint: "Read aloud by screen readers and shown if the image fails to load."}
                  - label: "Link"
                    name: "url"
                    widget: "string"
                    pattern: ['^(/|https?://|mailto:|tel:|#)', 'Start with / for a page on this site, for example /contact/. Use https:// for another site, # for a spot on the same page, or mailto: for an email address.']
                    hint: "A page on this site starts with a slash and ends with one, like /contact/. Anything else needs its full address starting https://."

          - label: "6. Partner logos"
            name: "partners"
            widget: "object"
            collapsed: true
            hint: "The scrolling logo rail below the industry tiles."
            fields:
              - {label: "Small label above the rail", name: "label", widget: "string"}
              - label: "Logos"
                name: "logos"
                label_singular: "partner"
                widget: "list"
                collapsed: true
                summary: "{{fields.alt}}"
                hint: "The rail scrolls, so it holds as many as you add. Below about six it can show the same logo twice at both ends, so tell a developer if the list ever gets that short."
                fields:
                  - {label: "Their website", name: "url", widget: "string", hint: "Full address, starting https://. Clicking the logo opens this in a new tab."}
                  - {label: "Logo", name: "image", widget: "image", media_folder: "/src/assets/partners", public_folder: "/assets/partners", hint: "Trim the empty space around the logo before uploading, or it renders smaller than the ones beside it. PNG with a transparent background is best."}
                  - {label: "Company name", name: "alt", widget: "string", hint: "Read aloud by screen readers, and shown if the image fails to load."}

          - label: "7. Latest from Insights"
            name: "insights"
            widget: "object"
            collapsed: true
            hint: "The strip of recent articles near the bottom. The articles themselves are pulled in automatically, so publishing one updates this section with no work here."
            fields:
              - {label: "Heading", name: "title", widget: "string"}
              - {label: "Link text", name: "link", widget: "string", hint: "Goes to the Insights page."}

          - label: "8. Closing call to action"
            name: "final_cta"
            widget: "object"
            collapsed: true
            hint: "The last band on the page, above the footer."
            fields:
              - {label: "Headline", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Primary button text", name: "primary", widget: "string"}
              - label: "Primary button link"
                name: "primary_url"
                widget: "string"
                pattern: ['^(/|https?://|mailto:|tel:|#)', 'Start with / for a page on this site, for example /contact/. Use https:// for another site, # for a spot on the same page, or mailto: for an email address.']
                hint: "A page on this site starts with a slash and ends with one, like /contact/. Anything else needs its full address starting https://."
              - {label: "Secondary button text", name: "secondary", widget: "string", required: false, hint: "Leave empty to show only one button."}
              - label: "Secondary button link"
                name: "secondary_url"
                widget: "string"
                pattern: ['^(/|https?://|mailto:|tel:|#)', 'Start with / for a page on this site, for example /contact/. Use https:// for another site, # for a spot on the same page, or mailto: for an email address.']
                hint: "A page on this site starts with a slash and ends with one, like /contact/. Anything else needs its full address starting https://."



  # ── Assess My Product (quiz) ─────

  - name: "about"
    label: "About"
    files:
      # ABOUT
      - name: "about"
        label: "About Us"
        file: "src/_data/about.yml"
        fields:
          - label: "1. Hero — the top of the page"
            name: "hero"
            widget: "object"
            collapsed: true
            hint: "The opening band: heading, the two intro paragraphs, the photograph and the button."
            fields:
            - {label: "Small label above the heading", name: "label", widget: "string"}
            - {label: "Heading", name: "title", widget: "string", hint: "Type <br> where you want the headline to break onto a new line. The break is ignored on phones."}
            - {label: "Subheading", name: "subtitle", widget: "text", hint: "Wrap a word in <strong> to emphasise it. Type &nbsp; between two words to stop them being split across a line break."}
            - {label: "Intro paragraph", name: "intro", widget: "text"}
            - {label: "Disciplines line", name: "disciplines", widget: "string"}
            - {label: "Second intro paragraph", name: "intro_secondary", widget: "text"}
            - {label: "Photograph", name: "image", widget: "image"}
            - {label: "Photograph description", name: "image_alt", widget: "string"}
            - {label: "Button text", name: "cta", widget: "string"}
            - label: "Button link"
              name: "cta_url"
              widget: "string"
              pattern: ['^(/|https?://|mailto:|tel:|#)', 'Start with / for a page on this site, for example /contact/. Use https:// for another site, # for a spot on the same page, or mailto: for an email address.']
              hint: "A page on this site starts with a slash and ends with one, like /contact/. Anything else needs its full address starting https://."

          - label: "2. Our story"
            name: "story"
            widget: "object"
            collapsed: true
            hint: "The founding story, told as a question and an answer."
            fields:
            - {label: "Small label above the heading", name: "label", widget: "string"}
            - {label: "Heading", name: "title", widget: "string", hint: "Type <br> where you want the headline to break onto a new line."}
            - {label: "Opening question", name: "question", widget: "text"}
            - {label: "Paragraphs", name: "body", widget: "list", field: {label: "Paragraph", name: "para", widget: "text"}}

          - label: "3. Why we exist"
            name: "why"
            widget: "object"
            collapsed: true
            hint: "The band with the full-width background photograph behind it."
            fields:
            - {label: "Small label above the heading", name: "label", widget: "string"}
            - {label: "Heading", name: "title", widget: "string"}
            - {label: "Background photograph", name: "bg_image", widget: "image", required: false, hint: "Sits behind the section, tinted to the brand navy so white text stays readable. A wide landscape photograph works best. Leave empty for a plain dark background."}
            - {label: "Paragraphs", name: "body", widget: "list", field: {label: "Paragraph", name: "para", widget: "text"}}

          - label: "4. Vision"
            name: "vision"
            widget: "object"
            collapsed: true
            hint: "One line. Sits beside the mission."
            fields:
            - {label: "Small label", name: "label", widget: "string"}
            - {label: "Text", name: "text", widget: "text"}

          - label: "5. Mission"
            name: "mission"
            widget: "object"
            collapsed: true
            hint: "Sits beside the vision."
            fields:
            - {label: "Small label", name: "label", widget: "string"}
            - {label: "Text", name: "text", widget: "text"}
            - {label: "Longer text", name: "body", widget: "text"}

          - label: "6. What makes us different"
            name: "different"
            widget: "object"
            collapsed: true
            hint: "The card grid."
            fields:
            - {label: "Small label above the heading", name: "label", widget: "string"}
            - {label: "Heading", name: "title", widget: "string", required: false, hint: "Optional. Leave it empty and only the What Makes Us Different heading shows, which is how it reads now."}
            - label: "Cards"
              name: "cards"
              widget: "list"
              summary: "{{fields.title}}"
              fields:
                - {label: "Title", name: "title", widget: "string"}
                - {label: "Body", name: "body", widget: "text"}

          - label: "7. Why customers choose us"
            name: "choose"
            widget: "object"
            collapsed: true
            hint: "The grouped list of reasons. Several registered claims live in here, so check docs/claim-review.yml before rewording any of them."
            fields:
            - {label: "Small label above the heading", name: "label", widget: "string"}
            - {label: "Heading", name: "title", widget: "string"}
            - label: "Groups"
              name: "groups"
              widget: "list"
              summary: "{{fields.title}}"
              fields:
                - {label: "Group Title", name: "title", widget: "string", hint: "Write the ampersand as &amp; and put &nbsp; either side of it, so the heading cannot break with the & left at the end of a line."}
                - {label: "Items", name: "items", widget: "list", field: {label: "Item", name: "item", widget: "string"}}

          - label: "8. Product matrices"
            name: "matrices"
            widget: "object"
            collapsed: true
            hint: "The list of product types the tag has been used in."
            fields:
            - {label: "Small label above the heading", name: "label", widget: "string"}
            - {label: "Heading", name: "title", widget: "string", hint: "CLAIM REVIEW: the 20+ figure has not been signed off. Do not publish this section without approval."}
            - {label: "Product types", name: "items", widget: "list", field: {label: "Category", name: "item", widget: "string"}}

          - label: "9. Closing call to action"
            name: "final_cta"
            widget: "object"
            collapsed: true
            hint: "The last band on the page, above the footer."
            fields:
            - {label: "Heading", name: "title", widget: "string"}
            - label: "Button link"
              name: "url"
              widget: "string"
              pattern: ['^(/|https?://|mailto:|tel:|#)', 'Start with / for a page on this site, for example /contact/. Use https:// for another site, # for a spot on the same page, or mailto: for an email address.']
              hint: "A page on this site starts with a slash and ends with one, like /contact/. Anything else needs its full address starting https://."


    # ── Solutions: NaturalTag ─────
      - name: "team-data"
        label: "All Team Members"
        file: "src/_data/team.json"
        fields:
          - {label: "Hero Title", name: "hero_title", widget: "string"}
          - {label: "Hero Subtitle", name: "hero_subtitle", widget: "text"}
          - {label: "Leadership Section Label", name: "leadership_label", widget: "string"}
          - {label: "Advisors Section Label", name: "advisors_label", widget: "string"}
          - {label: "CTA Text", name: "cta_text", widget: "string"}
          - label: "CTA URL"
            name: "cta_url"
            widget: "string"
            pattern: ['^(/|https?://|mailto:|tel:|#)', 'Start with / for a page on this site, for example /contact/. Use https:// for another site, # for a spot on the same page, or mailto: for an email address.']
            hint: "A page on this site starts with a slash and ends with one, like /contact/. Anything else needs its full address starting https://."
          - label: "Team members and advisors"
            name: "members"
            label_singular: "person"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Role", name: "role", widget: "string"}
              - {label: "Shown under", name: "type", widget: "select", options: ["leadership", "advisor"], hint: "Which section of the Team page this person appears in."}
              - {label: "Location", name: "location", widget: "string", required: false}
              - {label: "Photo", name: "photo", widget: "image", media_folder: "/src/assets/team", public_folder: "/assets/team", hint: "A square headshot works best. It is cropped to a circle."}
              - {label: "LinkedIn profile", name: "linkedin", widget: "string", required: false, hint: "Full address, starting https://. Leave empty and no icon appears."}
              - {label: "Education", name: "education", widget: "list", required: false, field: {label: "Degree", name: "degree", widget: "string"}}
              - {label: "Biography", name: "bio", widget: "list", hint: "One point per line. They appear as separate paragraphs when someone opens this person.", field: {label: "Paragraph", name: "point", widget: "string"}}
              - {label: "Position in the list", name: "order", widget: "number", hint: "Lower numbers appear first. Only matters relative to the other people in the same section."}

  # Insights: news, updates, and articles
      # CAREERS
      - name: "careers"
        label: "Careers"
        file: "src/_data/careers.yml"
        fields:
          - label: "1. Page introduction"
            name: "intro"
            widget: "object"
            collapsed: true
            hint: "The heading, the opening paragraph, and the wording on the two tabs below it."
            fields:
            - {label: "Small label above the heading", name: "label", widget: "string"}
            - {label: "Heading", name: "title", widget: "string"}
            - {label: "Opening paragraph", name: "text", widget: "text"}
            - {label: "First tab wording", name: "openings_tab", widget: "string"}
            - {label: "Second tab wording", name: "internship_tab", widget: "string"}

          - label: "2. Open positions"
            name: "openings"
            widget: "object"
            collapsed: true
            hint: "The roles on the first tab, and what shows when there are none."
            fields:
            - label: "Shown when there are no openings"
              name: "empty"
              widget: "object"
              fields:
                - {label: "Title", name: "title", widget: "string"}
                - {label: "Description", name: "description", widget: "text"}
            - label: "Positions"
              name: "positions"
              widget: "list"
              summary: "{{fields.title}} ({{fields.location}})"
              required: false
              fields:
                - {label: "Title", name: "title", widget: "string"}
                - {label: "Department", name: "department", widget: "string"}
                - {label: "Location", name: "location", widget: "string"}
                - {label: "Description", name: "description", widget: "text"}

            # The internship side of the page, and the form on it. Same gap as the
            # contact form had: all of this reads as editable copy and none of it
            # was reachable from the panel.

          - label: "3. Internships"
            name: "internships"
            widget: "object"
            collapsed: true
            hint: "The second tab: the description, the application form and its confirmation message."
            fields:
            - label: "Description"
              name: "details"
              widget: "object"
              collapsed: true
              fields:
                - {label: "Heading", name: "title", widget: "string"}
                - {label: "Description", name: "description", widget: "text"}
                - {label: "Expectations heading", name: "expectations_label", widget: "string"}
                - {label: "Expectations", name: "expectations", widget: "list", field: {label: "Item", name: "item", widget: "string"}}
                - {label: "Location", name: "location", widget: "string"}

            - label: "Application form"
              name: "form"
              widget: "object"
              collapsed: true
              fields:
                - {label: "Form Heading", name: "title", widget: "string"}

# Decap CMS Configuration for Natural Trace Website
# Content model matches the Clean Prototype Website Copy Guide 2026.
# Documentation: https://decapcms.org/docs/configuration-options/

# Authentication. Changed from git-gateway on 7 Aug 2026.
#
# git-gateway is a Netlify service and Netlify has deprecated it. It also only
# ever worked on the Netlify URL: on GitHub Pages the /admin page loaded and then
# could not log anyone in, because the /.netlify/identity endpoint it needs does
# not exist there.
#
# The GitHub backend talks to GitHub directly. The one thing a browser cannot do
# is exchange the login code for a token, because that needs a client secret, so
# base_url points at a small handler we run ourselves. Source is in oauth/,
# setup is in docs/cms-auth-setup.md.
#
# repo must be updated when this repository moves to a company organisation.
# base_url must be updated once the handler is deployed; until then, login fails.
backend:
  name: github
  repo: Natural-Trace/Natural-Trace-Website
  branch: main
  base_url: https://natural-trace-cms-auth.natural-trace.workers.dev
  auth_endpoint: auth

# Branding. `logo` is the only appearance setting Decap supports; everything
# else about how this panel looks is in admin/theme.css.
# https://decapcms.org/docs/configuration-options/#logo
#
# The paths are relative to /admin/, so they survive the site moving to a
# custom domain. The white wordmark is used because both the login screen and
# the header are dark (see theme.css).
logo:
  src: "../assets/logos/NT-logo-white.png"
  show_in_header: true

# site_url puts a "back to site" link on the login screen. display_url puts the
# site address in the header while logged in, so an editor always has one click
# back to what they are editing.
# https://decapcms.org/docs/configuration-options/#site-url
site_url: "https://natural-trace.github.io/Natural-Trace-Website"
display_url: "https://natural-trace.github.io/Natural-Trace-Website"
locale: "en"

media_folder: "src/assets/images/uploads"
public_folder: "/assets/images/uploads"

publish_mode: editorial_workflow

collections:
  - name: "pages"
    label: "Pages"
    files:
      # SITE SETTINGS
      - name: "site"
        label: "Site Settings"
        file: "src/_data/site.yml"
        fields:
          - {label: "Site Name", name: "name", widget: "string"}
          - {label: "Legal Name", name: "legal_name", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Canonical URL (no trailing slash)", name: "url", widget: "string"}
          - {label: "Default Meta Description", name: "default_summary", widget: "text"}
          - {label: "Founding Year", name: "founding_year", widget: "string"}
          - {label: "City", name: "locality", widget: "string"}
          - {label: "Country Code", name: "country", widget: "string"}
          - {label: "Contact Email", name: "email", widget: "string"}
          - {label: "Logo", name: "logo", widget: "image"}
          - {label: "Social Profile URLs", name: "social", widget: "list", field: {label: "URL", name: "url", widget: "string"}}
          - {label: "Allow AI crawlers", name: "allow_ai_crawlers", widget: "boolean", hint: "Lets ChatGPT, Claude, Perplexity and Google AI read the site"}

      # SEO: page titles and meta descriptions
      - name: "seo"
        label: "SEO: titles and descriptions"
        file: "src/_data/seo.yml"
        fields:
          # "url" is how an entry is matched to a page. It was a free text box,
          # which meant a typo silently detached a page's title and description
          # with nothing to show for it. It is a picker now, so it can only ever
          # be a page that exists.
          - label: "Search engine listings"
            name: "pages"
            widget: "list"
            collapsed: true
            summary: "{{fields.url}}  {{fields.title}}"
            fields:
              - label: "Which page"
                name: "url"
                widget: "select"
                hint: "Pick the page these words describe. If a new page has been added and is not in this list, a developer needs to add it."
                options:
                  - {label: "Home", value: "/"}
                  - {label: "About Us", value: "/about/"}
                  - {label: "NaturalTag", value: "/naturaltag/"}
                  - {label: "NaturalDetect", value: "/naturaldetect/"}
                  - {label: "NaturalCloud", value: "/naturalcloud/"}
                  - {label: "Industries", value: "/industries/"}
                  - {label: "Industry Use-Cases", value: "/industries/use-cases/"}
                  - {label: "FAQ", value: "/faq/"}
                  - {label: "Team", value: "/team/"}
                  - {label: "Careers", value: "/careers/"}
                  - {label: "Insights", value: "/insights/"}
                  - {label: "Assess My Product", value: "/assess/"}
                  - {label: "Contact", value: "/contact/"}
                  - {label: "Privacy Policy", value: "/privacy/"}
              - {label: "Headline in Google results", name: "title", widget: "string", hint: "What someone sees as the blue clickable line on a search results page. Around 60 characters before Google trims it."}
              - {label: "Description in Google results", name: "description", widget: "text", hint: "The grey paragraph under the headline. Aim for 150 to 160 characters: shorter wastes the space, longer gets cut off mid-sentence."}

      # HOME
      - name: "home"
        label: "Home"
        file: "src/_data/home.yml"
        fields:
          - {label: "Hero Background Image", name: "hero_bg_image", widget: "image"}
          - {label: "Hero Background Alt", name: "hero_bg_image_alt", widget: "string"}
          - {label: "Hero Image", name: "hero_image", widget: "image"}
          - {label: "Hero Image Alt", name: "hero_image_alt", widget: "string"}
          - {label: "Hero Title Line 1", name: "hero_title_line1", widget: "string"}
          - {label: "Hero Title Line 2 (italic)", name: "hero_title_line2", widget: "string"}
          - {label: "Hero Category Line", name: "hero_slogan", widget: "string"}
          - {label: "Hero Description", name: "hero_desc", widget: "text"}
          - {label: "Hero Claims (joined into one sentence)", name: "hero_claims", widget: "list", field: {label: "Claim", name: "claim", widget: "string"}}
          - {label: "Hero Claims Closing Phrase", name: "hero_claims_coda", widget: "string"}
          - {label: "Primary CTA Text", name: "hero_cta", widget: "string"}
          - {label: "Primary CTA URL", name: "hero_cta_url", widget: "string"}
          - {label: "Secondary CTA Text", name: "hero_cta_secondary", widget: "string"}
          - {label: "Secondary CTA URL", name: "hero_cta_secondary_url", widget: "string"}

          - {label: "Challenge: Label", name: "challenge_label", widget: "string"}
          - {label: "Challenge: Headline", name: "challenge_title", widget: "string"}
          - {label: "Challenge: Lead Paragraph", name: "challenge_lead", widget: "text"}
          - {label: "Challenge: List Heading", name: "challenge_list_label", widget: "string"}
          - {label: "Challenge: List", name: "challenge_list", widget: "list", field: {label: "Item", name: "item", widget: "string"}}
          - {label: "Challenge: Closing Statement", name: "challenge_close", widget: "text"}
          - {label: "Challenge: Image", name: "challenge_image", widget: "image"}
          - {label: "Challenge: Image Alt", name: "challenge_image_alt", widget: "string"}

          - {label: "Value Prop: Label", name: "vp_label", widget: "string"}
          - {label: "Value Prop: Headline", name: "vp_title", widget: "string"}
          - {label: "Value Prop: Subcopy", name: "vp_subtitle", widget: "text"}
          - {label: "Value Prop: Value Label", name: "vp_value_label", widget: "string"}
          - label: "Value Prop: Cards"
            name: "vp_cards"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Card Title", name: "title", widget: "string"}
              - {label: "Icon", name: "icon", widget: "select", options: ["target", "factory", "origin", "search", "shield"], hint: "The symbol in the circle beside the heading. target is a bullseye, origin is a diamond, search is a magnifying glass."}
              - {label: "Customer Problem", name: "problem", widget: "text", hint: "Shown without a label above it, so write it as a sentence that reads as the problem."}
              - {label: "Our value", name: "value", widget: "text"}

          - {label: "How It Works: Label", name: "how_label", widget: "string"}
          - {label: "How It Works: Headline", name: "how_title", widget: "string"}
          - label: "How It Works: Steps"
            name: "how_steps"
            widget: "list"
            label_singular: "step"
            collapsed: true
            summary: "{{fields.num}} {{fields.title}}"
            fields:
              - {label: "Number", name: "num", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
          - {label: "How It Works: Detail Link Text", name: "how_features_label", widget: "string", hint: "The line a visitor clicks to open the list below it."}
          - {label: "How It Works: Detail Points", name: "how_features", widget: "list", field: {label: "Point", name: "point", widget: "string"}}
          - {label: "Industries: Label", name: "industries_label", widget: "string"}
          - {label: "Industries: Headline", name: "industries_title", widget: "text"}
          - label: "Industries: Tiles"
            name: "industry_tiles"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Image Alt", name: "image_alt", widget: "string"}
              - {label: "Link URL", name: "url", widget: "string"}

          - {label: "Partners: Label", name: "trust_label", widget: "string"}
          - label: "Partner logos"
            name: "trust_logos"
            label_singular: "partner"
            widget: "list"
            collapsed: true
            summary: "{{fields.alt}}"
            hint: "The rail on the home page. It scrolls, so it holds as many as you add. Below about six the rail can show the same logo twice at both ends, so tell a developer if the list ever gets that short."
            fields:
              - {label: "Their website", name: "url", widget: "string", hint: "Full address, starting https://. Clicking the logo opens this in a new tab."}
              - {label: "Logo", name: "image", widget: "image", media_folder: "/src/assets/partners", public_folder: "/assets/partners", hint: "Trim the empty space around the logo before uploading, or it renders smaller than the ones beside it. PNG with a transparent background is best."}
              - {label: "Company name", name: "alt", widget: "string", hint: "Read aloud by screen readers, and shown if the image fails to load."}

          - {label: "Latest from Insights: heading", name: "insights_title", widget: "string", hint: "The small label above the three most recent articles near the bottom of the home page. The articles themselves are pulled automatically, so publishing one updates this section with no work here."}
          - {label: "Latest from Insights: link text", name: "insights_link", widget: "string", hint: "Goes to the Insights page."}
          - {label: "Final CTA: Headline", name: "final_cta_title", widget: "string"}
          - {label: "Final CTA: Text", name: "final_cta_text", widget: "text"}
          - {label: "Final CTA: Primary Button", name: "final_cta_primary", widget: "string"}
          - {label: "Final CTA: Primary URL", name: "final_cta_primary_url", widget: "string"}
          - {label: "Final CTA: Secondary Button", name: "final_cta_secondary", widget: "string", required: false, hint: "Leave empty to show only one button."}
          - {label: "Final CTA: Secondary URL", name: "final_cta_secondary_url", widget: "string"}


      # ASSESS. The compatibility quiz, moved off the home page on 6 Aug 2026.
      - name: "assess"
        label: "Assess My Product (quiz)"
        file: "src/_data/assess.yml"
        fields:
          - {label: "Quiz: Label", name: "compat_label", widget: "string"}
          - {label: "Quiz: Title", name: "compat_title", widget: "string"}
          - {label: "Quiz: Subtitle", name: "compat_subtitle", widget: "text"}
          - {label: "Quiz: Welcome Title", name: "compat_welcome_title", widget: "string"}
          - {label: "Quiz: Welcome Description", name: "compat_welcome_desc", widget: "text"}
          - {label: "Quiz: Welcome Button", name: "compat_welcome_cta", widget: "string"}
          - {label: "Quiz: Step 1 Question", name: "compat_step1_question", widget: "string"}
          - {label: "Quiz: Step 2 Question", name: "compat_step2_question", widget: "string"}
          - {label: "Quiz: Step 2 Hint", name: "compat_step2_hint", widget: "string"}
          - {label: "Quiz: Step 3 Question", name: "compat_step3_question", widget: "string"}
          - {label: "Quiz: Temperature Label", name: "compat_step3_temp_label", widget: "string"}
          - {label: "Quiz: pH Label", name: "compat_step3_ph_label", widget: "string"}
          - {label: "Quiz: Next Button", name: "compat_btn_next", widget: "string"}
          - {label: "Quiz: Back Button", name: "compat_btn_back", widget: "string"}
          - {label: "Quiz: Confirm Title", name: "compat_confirm_title", widget: "string", required: false, hint: "No longer shown. Kept so the old wording is not lost if the verdict is ever switched off."}
          - {label: "Quiz: Confirm Description", name: "compat_confirm_desc", widget: "text", required: false, hint: "No longer shown. See above."}
          - {label: "Quiz: Result CTA", name: "compat_result_cta", widget: "string"}
          - {label: "Quiz: Result CTA URL", name: "compat_result_cta_url", widget: "string"}
          - {label: "Quiz: Result Small Print", name: "compat_result_note", widget: "text"}

          # The scoring. These are claims about what NaturalTag tolerates, taken
          # from the NaturalTag Chemical Compatibility Guide v1.2. Changing a
          # band or a risk level changes what the site tells a prospect about
          # their product, so it is not a wording edit.
          - label: "Scoring: pH Bands"
            name: "compat_ph_options"
            widget: "list"
            label_singular: "band"
            collapsed: true
            summary: "{{fields.label}} — {{fields.risk}}"
            hint: "From section 3.1 of the compatibility guide. Do not change a band without checking it against that document."
            fields:
              - {label: "What the visitor sees", name: "label", widget: "string"}
              - {label: "Risk", name: "risk", widget: "select", options: ["low", "medium", "high"]}
          - label: "Scoring: Temperature Bands"
            name: "compat_temp_options"
            widget: "list"
            label_singular: "band"
            collapsed: true
            summary: "{{fields.label}} — {{fields.risk}}"
            hint: "From section 3.4 of the compatibility guide. 60°C is the threshold that document states."
            fields:
              - {label: "What the visitor sees", name: "label", widget: "string"}
              - {label: "Risk", name: "risk", widget: "select", options: ["low", "medium", "high"]}
          - label: "Scoring: Risk by Product Form"
            name: "compat_formulation_risk"
            widget: "object"
            collapsed: true
            hint: "Low, medium or high for each form the quiz offers. These are the old quiz's own rankings re-expressed, and unlike the pH and temperature bands they have no cited source. Changing one changes what the site tells a prospect."
            fields:
              - {label: "Compressed Tablet", name: "tablet", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Hard Capsule", name: "capsule", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Chewable", name: "chewable", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Powder / Sachet", name: "powder", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Effervescent", name: "effervescent", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Drops", name: "drops", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Softgel", name: "softgel", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Bar", name: "bar", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Gummy", name: "gummy", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Liquid / Syrup", name: "liquid", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Lozenge", name: "lozenge", widget: "select", options: ["low", "medium", "high"]}
              - {label: "RTD Beverage", name: "rtd", widget: "select", options: ["low", "medium", "high"]}
          - {label: "Result: Tested and it worked", name: "compat_evidence_yes", widget: "string"}
          - {label: "Result: Tested and it did not", name: "compat_evidence_no", widget: "text"}
          - label: "Tested Products"
            name: "compat_evidence"
            widget: "list"
            label_singular: "tested product"
            collapsed: true
            summary: "{{fields.category}} / {{fields.outcome}}"
            hint: "What has actually been through the lab. A row here overrides the pH, temperature and form scoring, because a tested result beats a rule. A pass lifts \"compatible with conditions\" to \"compatible\". A failure drops any answer to \"testing required\", which is deliberately not symmetric: being wrong about a yes costs a client a failed trial, being wrong about a no costs a conversation."
            fields:
              - label: "Product category"
                name: "category"
                widget: "select"
                hint: "Must match a category the quiz offers, or the row will never fire."
                options:
                  - {label: "Vitamins & Minerals", value: "vitamins"}
                  - {label: "Omega-3 & Fish Oil", value: "omega"}
                  - {label: "Probiotics & Gut Health", value: "probiotics"}
                  - {label: "Joint & Bone", value: "joint"}
                  - {label: "Collagen & Beauty", value: "collagen"}
                  - {label: "Herbal & Botanical", value: "herbal"}
                  - {label: "Sports Nutrition", value: "sports"}
                  - {label: "Immune Support", value: "immune"}
                  - {label: "Weight Management", value: "weight"}
                  - {label: "Specialty Food Ingredients", value: "ingredients"}
                  - {label: "Specialty Health", value: "specialty"}
                  - {label: "Functional Foods", value: "functional"}
              - label: "Product forms tested"
                name: "forms"
                widget: "select"
                multiple: true
                hint: "Tick every form this result covers. The row fires when a visitor picks any one of them."
                options:
                  - {label: "Compressed Tablet", value: "tablet"}
                  - {label: "Hard Capsule", value: "capsule"}
                  - {label: "Softgel", value: "softgel"}
                  - {label: "Gummy", value: "gummy"}
                  - {label: "Chewable", value: "chewable"}
                  - {label: "Powder / Sachet", value: "powder"}
                  - {label: "Liquid / Syrup", value: "liquid"}
                  - {label: "Effervescent", value: "effervescent"}
                  - {label: "Lozenge", value: "lozenge"}
                  - {label: "Bar", value: "bar"}
                  - {label: "RTD Beverage", value: "rtd"}
                  - {label: "Drops", value: "drops"}
              - label: "Outcome"
                name: "outcome"
                widget: "select"
                default: "unconfirmed"
                hint: "Leave on Unconfirmed until someone has the data in front of them. Compatible and Not compatible both change what a prospect is told about their own product."
                options:
                  - {label: "Unconfirmed — tested, result not to hand", value: "unconfirmed"}
                  - {label: "Compatible — it worked", value: "compatible"}
                  - {label: "Compatible with conditions", value: "conditions"}
                  - {label: "Not compatible — it did not work", value: "not-compatible"}
              - {label: "pH it was tested at", name: "ph", widget: "string", required: false, hint: "Free text, whatever is true. \"5.8\", \"3.2 to 4.1\", \"not measured\"."}
              - {label: "Temperature it was tested at", name: "temperature", widget: "string", required: false, hint: "Free text. \"ambient\", \"up to 80°C\", \"retort, 121°C\"."}
              - {label: "Product name", name: "products", widget: "string", required: false, hint: "OPTIONAL, AND PUBLISHED. This file builds into the live site. Only put a client's product name here if they have agreed to be named."}
              - {label: "Internal note", name: "note", widget: "text", required: false, hint: "Not shown on the site. Accuracy, sample size, anything the next person needs."}

          - label: "Result: Compatible"
            name: "compat_outcomes"
            widget: "object"
            collapsed: true
            fields:
              - label: "Compatible"
                name: "compatible"
                widget: "object"
                fields:
                  - {label: "Badge", name: "label", widget: "string"}
                  - {label: "Heading", name: "title", widget: "string"}
                  - {label: "Body", name: "body", widget: "text"}
              - label: "Compatible with conditions"
                name: "conditions"
                widget: "object"
                fields:
                  - {label: "Badge", name: "label", widget: "string"}
                  - {label: "Heading", name: "title", widget: "string"}
                  - {label: "Body", name: "body", widget: "text"}
              - label: "Testing required"
                name: "testing"
                widget: "object"
                fields:
                  - {label: "Badge", name: "label", widget: "string"}
                  - {label: "Heading", name: "title", widget: "string"}
                  - {label: "Body", name: "body", widget: "text"}

      # ABOUT
      - name: "about"
        label: "About Us"
        file: "src/_data/about.yml"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Headline", name: "title", widget: "string"}
          - {label: "Sub-headline", name: "subtitle", widget: "text"}
          - {label: "Intro", name: "intro", widget: "text"}
          - {label: "Disciplines Line", name: "disciplines", widget: "string"}
          - {label: "Secondary Intro", name: "intro_secondary", widget: "text"}
          - {label: "Hero Image", name: "hero_image", widget: "image"}
          - {label: "Hero Image Alt", name: "hero_image_alt", widget: "string"}
          - {label: "Hero CTA Text", name: "hero_cta", widget: "string"}
          - {label: "Hero CTA URL", name: "hero_cta_url", widget: "string"}
          - {label: "Story: Label", name: "story_label", widget: "string"}
          - {label: "Story: Headline", name: "story_title", widget: "string", hint: "Type <br> where you want the headline to break onto a new line."}
          - {label: "Story: Opening Question", name: "story_question", widget: "text"}
          - {label: "Story: Paragraphs", name: "story_body", widget: "list", field: {label: "Paragraph", name: "para", widget: "text"}}
          - {label: "Why We Exist: Label", name: "why_label", widget: "string"}
          - {label: "Why We Exist: Headline", name: "why_title", widget: "string"}
          - {label: "Why We Exist: Paragraphs", name: "why_body", widget: "list", field: {label: "Paragraph", name: "para", widget: "text"}}
          - {label: "Vision Label", name: "vision_label", widget: "string"}
          - {label: "Vision Text", name: "vision_text", widget: "text"}
          - {label: "Mission Label", name: "mission_label", widget: "string"}
          - {label: "Mission Text", name: "mission_text", widget: "text"}
          - {label: "Mission Body", name: "mission_body", widget: "text"}
          - {label: "Different: Label", name: "different_label", widget: "string"}
          - {label: "Different: Sub-headline", name: "different_title", widget: "string", required: false, hint: "Optional. Leave it empty and only the What Makes Us Different heading shows, which is how it reads now."}
          - label: "Different: Cards"
            name: "different_cards"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Body", name: "body", widget: "text"}
          - {label: "Why Choose: Label", name: "choose_label", widget: "string"}
          - {label: "Why Choose: Headline", name: "choose_title", widget: "string"}
          - label: "Why Choose: Groups"
            name: "choose_groups"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Group Title", name: "title", widget: "string"}
              - {label: "Items", name: "items", widget: "list", field: {label: "Item", name: "item", widget: "string"}}
          - {label: "Food Matrices: Label", name: "matrices_label", widget: "string"}
          - {label: "Food Matrices: Headline", name: "matrices_title", widget: "string", hint: "CLAIM REVIEW: the 20+ figure has not been signed off. Do not publish this section without approval."}
          - {label: "Food Matrices: Categories", name: "matrices_items", widget: "list", field: {label: "Category", name: "item", widget: "string"}}
          - {label: "CTA Title", name: "cta_title", widget: "string"}
          - {label: "CTA URL", name: "cta_url", widget: "string"}

      # SOLUTIONS: NATURALTAG
      - name: "naturaltag"
        label: "Solutions: NaturalTag"
        file: "src/_data/naturaltag.yml"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Hero Line", name: "hero", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}
          - {label: "Product Photograph", name: "hero_image", widget: "image", required: false, hint: "Landscape. Shown instead of the logo panel when set; clear it to go back to the logo. NaturalCloud has none yet, which is why its page still shows the mark."}
          - {label: "Product Photograph: Alt Text", name: "hero_image_alt", widget: "string", required: false, hint: "What is in the picture, for anyone using a screen reader. Only needed if a photograph is set."}
          - {label: "Product Logo", name: "hero_logo", widget: "image"}
          - {label: "Product Logo Alt", name: "hero_logo_alt", widget: "string"}
          - {label: "Why Heading", name: "why_title", widget: "string"}
          - {label: "Why Items", name: "why_items", widget: "list", field: {label: "Item", name: "item", widget: "string"}}
          - {label: "Features Heading", name: "features_title", widget: "string"}
          - {label: "Features", name: "features", widget: "list", field: {label: "Feature", name: "feature", widget: "string"}}
          - {label: "Matrices Label", name: "matrices_label", widget: "string"}
          - {label: "Matrices Heading", name: "matrices_title", widget: "string"}
          - label: "Matrices"
            name: "matrices"
            widget: "list"
            summary: "{{fields.group}}"
            fields:
              - {label: "Group", name: "group", widget: "string"}
              - {label: "Items", name: "items", widget: "text"}
          - {label: "Video Label", name: "video_label", widget: "string"}
          - {label: "Video Title", name: "video_title", widget: "string"}
          - {label: "Video Description", name: "video_description", widget: "text"}
          - {label: "Video File Path", name: "video_src", widget: "string"}
          - {label: "CTA Text", name: "cta_text", widget: "string"}
          - {label: "CTA URL", name: "cta_url", widget: "string"}

      - name: "naturaldetect"
        label: "Solutions: NaturalDetect"
        file: "src/_data/naturaldetect.yml"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Hero Line", name: "hero", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}
          - {label: "Product Photograph", name: "hero_image", widget: "image", required: false, hint: "Landscape. Shown instead of the logo panel when set; clear it to go back to the logo. NaturalCloud has none yet, which is why its page still shows the mark."}
          - {label: "Product Photograph: Alt Text", name: "hero_image_alt", widget: "string", required: false, hint: "What is in the picture, for anyone using a screen reader. Only needed if a photograph is set."}
          - {label: "Product Logo", name: "hero_logo", widget: "image"}
          - {label: "Product Logo Alt", name: "hero_logo_alt", widget: "string"}
          - {label: "Features Heading", name: "features_title", widget: "string"}
          - {label: "Features", name: "features", widget: "list", field: {label: "Feature", name: "feature", widget: "string"}}
          - {label: "Primary CTA", name: "cta_primary", widget: "string"}
          - {label: "Primary CTA URL", name: "cta_primary_url", widget: "string"}
          - {label: "Secondary CTA", name: "cta_secondary", widget: "string"}
          - {label: "Secondary CTA URL", name: "cta_secondary_url", widget: "string"}

      # SOLUTIONS: NATURALCLOUD
      - name: "naturalcloud"
        label: "Solutions: NaturalCloud"
        file: "src/_data/naturalcloud.yml"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Hero Line", name: "hero", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}
          - {label: "Product Photograph", name: "hero_image", widget: "image", required: false, hint: "Landscape. Shown instead of the logo panel when set; clear it to go back to the logo. NaturalCloud has none yet, which is why its page still shows the mark."}
          - {label: "Product Photograph: Alt Text", name: "hero_image_alt", widget: "string", required: false, hint: "What is in the picture, for anyone using a screen reader. Only needed if a photograph is set."}
          - {label: "Product Logo", name: "hero_logo", widget: "image"}
          - {label: "Product Logo Alt", name: "hero_logo_alt", widget: "string"}
          - {label: "Benefits Heading", name: "features_title", widget: "string"}
          - {label: "Benefits", name: "features", widget: "list", field: {label: "Benefit", name: "benefit", widget: "string"}}
          - {label: "Primary CTA", name: "cta_primary", widget: "string"}
          - {label: "Primary CTA URL", name: "cta_primary_url", widget: "string"}
          - {label: "Secondary CTA", name: "cta_secondary", widget: "string"}
          - {label: "Secondary CTA URL", name: "cta_secondary_url", widget: "string"}

      # INDUSTRIES
      - name: "industries"
        label: "Industries"
        file: "src/_data/industries.yml"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Headline", name: "title", widget: "string"}
          - {label: "Subtitle", name: "subtitle", widget: "text"}
          - label: "Industries"
            name: "industries"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Internal name", name: "id", widget: "string", hint: "Used in links that jump straight to this industry, e.g. /industries/#agri-food. Changing it breaks those links."}
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Image Alt", name: "image_alt", widget: "string"}
          - {label: "CTA Label", name: "cta_label", widget: "string"}
          - {label: "CTA Title", name: "cta_title", widget: "string"}
          - {label: "CTA Description", name: "cta_description", widget: "text"}
          - {label: "CTA Primary Text", name: "cta_button_primary_text", widget: "string"}
          - {label: "CTA Primary URL", name: "cta_button_primary_url", widget: "string"}
          - {label: "CTA Secondary Text", name: "cta_button_secondary_text", widget: "string"}
          - {label: "CTA Secondary URL", name: "cta_button_secondary_url", widget: "string"}

      # INDUSTRY USE-CASES
      - name: "usecases"
        label: "Industry Use-Cases"
        file: "src/_data/usecases.yml"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Headline", name: "title", widget: "string"}
          - {label: "Subtitle", name: "subtitle", widget: "text"}
          - label: "Use Cases"
            name: "cases"
            widget: "list"
            summary: "{{fields.sector}} — {{fields.title}}"
            fields:
              - {label: "Sector", name: "sector", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Challenge", name: "challenge", widget: "text"}
              - {label: "How Natural Trace Helped", name: "solution", widget: "text"}
              - {label: "Outcome", name: "outcome", widget: "text"}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Image Alt", name: "image_alt", widget: "string"}
          - {label: "Challenge Label", name: "challenge_label", widget: "string"}
          - {label: "Solution Label", name: "solution_label", widget: "string"}
          - {label: "Outcome Label", name: "outcome_label", widget: "string"}
          - {label: "CTA Title", name: "cta_title", widget: "string"}
          - {label: "CTA URL", name: "cta_url", widget: "string"}

      # CAREERS
      - name: "careers"
        label: "Careers"
        file: "src/_data/careers.yml"
        fields:
          - {label: "Section Label", name: "section_label", widget: "string"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}
          - {label: "Open Positions Tab Label", name: "tab_openings_label", widget: "string"}
          - {label: "Internships Tab Label", name: "tab_internship_label", widget: "string"}
          - label: "No Openings Message"
            name: "no_openings"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
          - label: "Open Positions"
            name: "positions"
            widget: "list"
            summary: "{{fields.title}} ({{fields.location}})"
            required: false
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Department", name: "department", widget: "string"}
              - {label: "Location", name: "location", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

          # The internship side of the page, and the form on it. Same gap as the
          # contact form had: all of this reads as editable copy and none of it
          # was reachable from the panel.
          - label: "Internship: intro"
            name: "internship"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Heading", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Expectations heading", name: "expectations_label", widget: "string"}
              - {label: "Expectations", name: "expectations", widget: "list", field: {label: "Item", name: "item", widget: "string"}}
              - {label: "Location", name: "location", widget: "string"}

          - label: "Internship: application form"
            name: "internship_form"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Form Heading", name: "title", widget: "string"}
              - {label: "Form Intro", name: "subtitle", widget: "text"}
              - {label: "First Name: label", name: "first_name_label", widget: "string"}
              - {label: "First Name: placeholder", name: "first_name_placeholder", widget: "string"}
              - {label: "Last Name: label", name: "last_name_label", widget: "string"}
              - {label: "Last Name: placeholder", name: "last_name_placeholder", widget: "string"}
              - {label: "Email: label", name: "email_label", widget: "string"}
              - {label: "Email: placeholder", name: "email_placeholder", widget: "string"}
              - {label: "University: label", name: "university_label", widget: "string"}
              - {label: "University: placeholder", name: "university_placeholder", widget: "string"}
              - {label: "Area of interest: label", name: "interest_label", widget: "string"}
              - {label: "Area of interest: placeholder", name: "interest_placeholder", widget: "string"}
              - {label: "Message: label", name: "message_label", widget: "string"}
              - {label: "Message: placeholder", name: "message_placeholder", widget: "string"}
              - {label: "Submit button", name: "submit_text", widget: "string"}

          - {label: "Internship: areas of interest", name: "areas_of_interest", widget: "list", field: {label: "Area", name: "area", widget: "string"}}

          - label: "Internship: after sending"
            name: "success"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Heading", name: "title", widget: "string"}
              - {label: "Message", name: "message", widget: "text"}

      # CONTACT
      - name: "contact"
        label: "Contact"
        file: "src/_data/contact.yml"
        fields:
          - {label: "Section Label", name: "section_label", widget: "string"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Subtitle", name: "subtitle", widget: "text"}
          - label: "Info Items"
            name: "info_items"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

          # The form itself. Every label and placeholder on the contact form is
          # here. Renaming a field is a copy change, not a developer change.
          - label: "Contact Form"
            name: "form"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Form Heading", name: "title", widget: "string"}
              - {label: "Form Intro", name: "subtitle", widget: "text"}
              - {label: "First Name: label", name: "first_name_label", widget: "string"}
              - {label: "First Name: placeholder", name: "first_name_placeholder", widget: "string"}
              - {label: "Last Name: label", name: "last_name_label", widget: "string"}
              - {label: "Last Name: placeholder", name: "last_name_placeholder", widget: "string"}
              - {label: "Email: label", name: "email_label", widget: "string"}
              - {label: "Email: placeholder", name: "email_placeholder", widget: "string"}
              - {label: "Company: label", name: "company_label", widget: "string"}
              - {label: "Company: placeholder", name: "company_placeholder", widget: "string"}
              - {label: "Job Title: label", name: "job_title_label", widget: "string"}
              - {label: "Job Title: placeholder", name: "job_title_placeholder", widget: "string"}
              - {label: "Inquiry Type: label", name: "inquiry_type_label", widget: "string"}
              - {label: "Inquiry Type: placeholder", name: "inquiry_type_placeholder", widget: "string"}
              - {label: "Message: label", name: "message_label", widget: "string"}
              - {label: "Message: placeholder", name: "message_placeholder", widget: "string"}
              - {label: "Submit button", name: "submit_text", widget: "string"}

          # WARNING: "Value sent to HubSpot" is data, not copy. It is written to
          # the inquiry_type property on the contact record. Changing it changes
          # what future enquiries are filed as, and does not rename anything
          # already in HubSpot. Change the visible label freely; change the value
          # only deliberately.
          - label: "Inquiry Type options"
            name: "inquiry_types"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - {label: "Value sent to HubSpot", name: "value", widget: "string"}
              - {label: "Label shown to the visitor", name: "label", widget: "string"}

          - label: "After sending: success"
            name: "success"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Heading", name: "title", widget: "string"}
              - {label: "Message", name: "message", widget: "text"}

          # Shown when the enquiry is handed to the visitor's email client
          # instead of going straight to HubSpot.
          - label: "After sending: email fallback"
            name: "fallback"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Heading", name: "title", widget: "string"}
              - {label: "Message", name: "message", widget: "text"}

          - label: "After sending: failure"
            name: "error"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Heading", name: "title", widget: "string"}
              - {label: "Message", name: "message", widget: "text"}

          - label: "Closing call to action"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Section Label", name: "section_label", widget: "string"}
              - {label: "Heading", name: "title", widget: "string"}
              - {label: "Subcopy", name: "subtitle", widget: "text"}
              - {label: "Primary button text", name: "primary_text", widget: "string"}
              - {label: "Primary button link", name: "primary_href", widget: "string"}
              - {label: "Secondary button text", name: "secondary_text", widget: "string"}
              - {label: "Secondary button link", name: "secondary_href", widget: "string"}

      # FAQ
      - name: "faq"
        label: "FAQ"
        file: "src/_data/faq.yml"
        fields:
          - {label: "Section Label", name: "section_label", widget: "string"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Subtitle", name: "subtitle", widget: "text"}
          - label: "Categories"
            name: "categories"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - {label: "Internal name", name: "id", widget: "string", hint: "Used to link questions to this tab. Changing it detaches every question filed under it, so leave it alone unless you are also updating the questions."}
              - {label: "Tab name visitors see", name: "label", widget: "string"}
          - label: "Questions"
            name: "questions"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - label: "Which tab"
                name: "category"
                widget: "select"
                hint: "The tab this question appears under. These match the internal names above."
                options: ["regulatory", "safety", "integration", "detection"]
              - {label: "Question", name: "question", widget: "string"}
              - {label: "Answer", name: "answer", widget: "text"}
          - {label: "CTA Title", name: "cta_title", widget: "string"}
          - {label: "CTA Text", name: "cta_text", widget: "text"}
          - {label: "CTA Button", name: "cta_button", widget: "string"}

  - name: "integrations"
    label: "Integrations"
    files:
      - name: "hubspot"
        label: "HubSpot & Contact Form"
        file: "src/_data/integrations.yml"
        fields:
          - label: "HubSpot"
            name: "hubspot"
            widget: "object"
            hint: "Portal ID and Form GUID are safe to publish. NEVER paste a HubSpot private-app token, access token, or API key here. Everything in this file is visible to the public."
            fields:
              - label: "Send submissions to HubSpot"
                name: "enabled"
                widget: "boolean"
                default: false
                hint: "Only takes effect once Portal ID and Form GUID are both filled in. While off, the form opens the visitor's email client instead."
              - label: "Portal ID (Hub ID)"
                name: "portal_id"
                widget: "string"
                required: false
                hint: "HubSpot: Settings -> Account Management -> Account Defaults."
              - label: "Form GUID"
                name: "form_guid"
                widget: "string"
                required: false
                hint: "HubSpot: Marketing -> Forms -> your form -> Share -> Embed code."
              - label: "Data centre"
                name: "region"
                widget: "select"
                options: ["na1", "na2", "eu1"]
                default: "na1"
                hint: "Natural Trace is on na2. Read it off HubSpot's own embed code, or the app URL: app-eu1 means eu1. Getting this wrong sends enquiries to a region that has never heard of the form."
              - label: "Field mapping"
                name: "field_map"
                widget: "object"
                hint: "The names these fields have inside HubSpot. Do not change them unless HubSpot has been changed to match, or enquiries stop arriving. Leave one empty to stop sending that field."
                fields:
                  - {label: "First name", name: "firstName", widget: "string", required: false}
                  - {label: "Last name", name: "lastName", widget: "string", required: false}
                  - {label: "Email", name: "email", widget: "string", required: false}
                  - {label: "Company", name: "company", widget: "string", required: false}
                  - {label: "Job title", name: "jobTitle", widget: "string", required: false}
                  - {label: "Inquiry type", name: "inquiryType", widget: "string", required: false}
                  - {label: "Message", name: "message", widget: "string", required: false}
          - label: "Email fallback"
            name: "fallback"
            widget: "object"
            hint: "Used when HubSpot is off, unconfigured, or unreachable, so an inquiry is never lost."
            fields:
              - {label: "Inbox address", name: "email", widget: "string"}
              - {label: "Subject prefix", name: "subject_prefix", widget: "string"}
          - label: "Internship applications"
            name: "careers"
            widget: "object"
            hint: "The internship form on the Careers page opens the applicant's email client. This is the address it writes to."
            fields:
              - {label: "Applications go to", name: "internship_email", widget: "string"}
              - {label: "Subject prefix", name: "internship_subject_prefix", widget: "string"}
          - label: "Sitewide Tracking"
            name: "tracking"
            widget: "object"
            fields:
              - {label: "Enabled", name: "enabled", widget: "boolean", hint: "Also needs a HubSpot Portal ID above, and visitor consent"}
          - label: "Cookie Consent Banner"
            name: "consent"
            widget: "object"
            fields:
              - {label: "Show banner", name: "enabled", widget: "boolean"}
              - {label: "Message", name: "message", widget: "text"}
              - {label: "Accept button", name: "accept_label", widget: "string"}
              - {label: "Decline button", name: "decline_label", widget: "string"}
              - {label: "Policy link text", name: "policy_label", widget: "string"}
              - {label: "Policy link URL", name: "policy_url", widget: "string"}

  - name: "team"
    label: "Team Members"
    files:
      - name: "team-data"
        label: "All Team Members"
        file: "src/_data/team.json"
        fields:
          - {label: "Hero Title", name: "hero_title", widget: "string"}
          - {label: "Hero Subtitle", name: "hero_subtitle", widget: "text"}
          - {label: "Leadership Section Label", name: "leadership_label", widget: "string"}
          - {label: "Advisors Section Label", name: "advisors_label", widget: "string"}
          - {label: "CTA Text", name: "cta_text", widget: "string"}
          - {label: "CTA URL", name: "cta_url", widget: "string"}
          - label: "Team members and advisors"
            name: "members"
            label_singular: "person"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Role", name: "role", widget: "string"}
              - {label: "Shown under", name: "type", widget: "select", options: ["leadership", "advisor"], hint: "Which section of the Team page this person appears in."}
              - {label: "Location", name: "location", widget: "string", required: false}
              - {label: "Photo", name: "photo", widget: "image", media_folder: "/src/assets/team", public_folder: "/assets/team", hint: "A square headshot works best. It is cropped to a circle."}
              - {label: "LinkedIn profile", name: "linkedin", widget: "string", required: false, hint: "Full address, starting https://. Leave empty and no icon appears."}
              - {label: "Education", name: "education", widget: "list", required: false, field: {label: "Degree", name: "degree", widget: "string"}}
              - {label: "Biography", name: "bio", widget: "list", hint: "One point per line. They appear as separate paragraphs when someone opens this person.", field: {label: "Paragraph", name: "point", widget: "string"}}
              - {label: "Position in the list", name: "order", widget: "number", hint: "Lower numbers appear first. Only matters relative to the other people in the same section."}

  # Insights: news, updates, and articles
  - name: "insights"
    label: "Insights articles"
    label_singular: "article"
    folder: "src/insights"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["date", "title"]
    media_folder: "/src/assets/images/insights"
    public_folder: "/assets/images/insights"
    fields:
      - {label: "Headline", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime", hint: "Articles are listed newest first. Post-dating one does not hide it."}
      - {label: "Author", name: "author", widget: "string", default: "Natural Trace Team"}
      - {label: "Pin to the top of Insights", name: "pinned", widget: "boolean", default: false, required: false, hint: "Pinned articles sit above the rest regardless of date. Use sparingly, or nothing stands out."}
      - {label: "Header image", name: "image", widget: "image", required: false, hint: "Shown at the top of the article and on its card. Landscape works best, around 1200px wide."}
      - {label: "Summary", name: "summary", widget: "text", hint: "The paragraph on the article's card. Also used as the Google description unless you set one below."}
      - {label: "Article", name: "body", widget: "markdown"}
      - {label: "Tags", name: "tags", widget: "list", required: false, field: {label: "Tag", name: "tag", widget: "string"}}
      - {label: "Google headline (optional)", name: "seo_title", widget: "string", required: false, hint: "Only if the headline above is not what you want appearing in search results. Leave empty to use the headline."}
      - {label: "Google description (optional)", name: "seo_description", widget: "text", required: false, hint: "Only if the summary above is not right for search results. Aim for 150 to 160 characters. Leave empty to use the summary."}

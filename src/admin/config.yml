            name: "compat_result_cta_url"
            widget: "string"
            pattern: ['^(/|https?://|mailto:|tel:|#)', 'Start with / for a page on this site, for example /contact/. Use https:// for another site, # for a spot on the same page, or mailto: for an email address.']
            hint: "A page on this site starts with a slash and ends with one, like /contact/. Anything else needs its full address starting https://."
          - {label: "Quiz: Result Small Print", name: "compat_result_note", widget: "text"}

          # The scoring. These are claims about what NaturalTag tolerates, taken
          # from the NaturalTag Chemical Compatibility Guide v1.2. Changing a
          # band or a risk level changes what the site tells a prospect about
          # their product, so it is not a wording edit.
          - label: "Scoring: pH Bands"
            name: "compat_ph_options"
            widget: "list"
            label_singular: "band"
            collapsed: true
            summary: "{{fields.label}} — {{fields.risk}}"
            hint: "From section 3.1 of the compatibility guide. Do not change a band without checking it against that document."
            fields:
              - {label: "What the visitor sees", name: "label", widget: "string"}
              - {label: "Risk", name: "risk", widget: "select", options: ["low", "medium", "high"]}
          - label: "Scoring: Temperature Bands"
            name: "compat_temp_options"
            widget: "list"
            label_singular: "band"
            collapsed: true
            summary: "{{fields.label}} — {{fields.risk}}"
            hint: "From section 3.4 of the compatibility guide. 60°C is the threshold that document states."
            fields:
              - {label: "What the visitor sees", name: "label", widget: "string"}
              - {label: "Risk", name: "risk", widget: "select", options: ["low", "medium", "high"]}
          - label: "Scoring: Risk by Product Form"
            name: "compat_formulation_risk"
            widget: "object"
            collapsed: true
            hint: "Low, medium or high for each form the quiz offers. These are the old quiz's own rankings re-expressed, and unlike the pH and temperature bands they have no cited source. Changing one changes what the site tells a prospect."
            fields:
              - {label: "Compressed Tablet", name: "tablet", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Hard Capsule", name: "capsule", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Chewable", name: "chewable", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Powder / Sachet", name: "powder", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Effervescent", name: "effervescent", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Drops", name: "drops", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Softgel", name: "softgel", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Bar", name: "bar", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Gummy", name: "gummy", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Liquid / Syrup", name: "liquid", widget: "select", options: ["low", "medium", "high"]}
              - {label: "Lozenge", name: "lozenge", widget: "select", options: ["low", "medium", "high"]}
              - {label: "RTD Beverage", name: "rtd", widget: "select", options: ["low", "medium", "high"]}
          - {label: "Result: Tested and it worked", name: "compat_evidence_yes", widget: "string"}
          - {label: "Result: Tested and it did not", name: "compat_evidence_no", widget: "text"}
          - label: "Tested Products"
            name: "compat_evidence"
            widget: "list"
            label_singular: "tested product"
            collapsed: true
            summary: "{{fields.category}} / {{fields.outcome}}"
            hint: "What has actually been through the lab. A row here overrides the pH, temperature and form scoring, because a tested result beats a rule. A pass lifts \"compatible with conditions\" to \"compatible\". A failure drops any answer to \"testing required\", which is deliberately not symmetric: being wrong about a yes costs a client a failed trial, being wrong about a no costs a conversation."
            fields:
              - label: "Product category"
                name: "category"
                widget: "select"
                hint: "Must match a category the quiz offers, or the row will never fire."
                options:
                  - {label: "Vitamins & Minerals", value: "vitamins"}
                  - {label: "Omega-3 & Fish Oil", value: "omega"}
                  - {label: "Probiotics & Gut Health", value: "probiotics"}
                  - {label: "Joint & Bone", value: "joint"}
                  - {label: "Collagen & Beauty", value: "collagen"}
                  - {label: "Herbal & Botanical", value: "herbal"}
                  - {label: "Sports Nutrition", value: "sports"}
                  - {label: "Immune Support", value: "immune"}
                  - {label: "Weight Management", value: "weight"}
                  - {label: "Specialty Food Ingredients", value: "ingredients"}
                  - {label: "Specialty Health", value: "specialty"}
                  - {label: "Functional Foods", value: "functional"}
              - label: "Product forms tested"
                name: "forms"
                widget: "select"
                multiple: true
                hint: "Tick every form this result covers. The row fires when a visitor picks any one of them."
                options:
                  - {label: "Compressed Tablet", value: "tablet"}
                  - {label: "Hard Capsule", value: "capsule"}
                  - {label: "Softgel", value: "softgel"}
                  - {label: "Gummy", value: "gummy"}
                  - {label: "Chewable", value: "chewable"}
                  - {label: "Powder / Sachet", value: "powder"}
                  - {label: "Liquid / Syrup", value: "liquid"}
                  - {label: "Effervescent", value: "effervescent"}
                  - {label: "Lozenge", value: "lozenge"}
                  - {label: "Bar", value: "bar"}
                  - {label: "RTD Beverage", value: "rtd"}
                  - {label: "Drops", value: "drops"}
              - label: "Outcome"
                name: "outcome"
                widget: "select"
                default: "unconfirmed"
                hint: "Leave on Unconfirmed until someone has the data in front of them. Compatible and Not compatible both change what a prospect is told about their own product."
                options:
                  - {label: "Unconfirmed — tested, result not to hand", value: "unconfirmed"}
                  - {label: "Compatible — it worked", value: "compatible"}
                  - {label: "Compatible with conditions", value: "conditions"}
                  - {label: "Not compatible — it did not work", value: "not-compatible"}
              - {label: "pH it was tested at", name: "ph", widget: "string", required: false, hint: "Free text, whatever is true. \"5.8\", \"3.2 to 4.1\", \"not measured\"."}
              - {label: "Temperature it was tested at", name: "temperature", widget: "string", required: false, hint: "Free text. \"ambient\", \"up to 80°C\", \"retort, 121°C\"."}
              - {label: "Product name", name: "products", widget: "string", required: false, hint: "OPTIONAL, AND PUBLISHED. This file builds into the live site. Only put a client's product name here if they have agreed to be named."}
              - {label: "Internal note", name: "note", widget: "text", required: false, hint: "Not shown on the site. Accuracy, sample size, anything the next person needs."}

          - label: "Result: Compatible"
            name: "compat_outcomes"
            widget: "object"
            collapsed: true
            fields:
              - label: "Compatible"
                name: "compatible"
                widget: "object"
                fields:
                  - {label: "Badge", name: "label", widget: "string"}
                  - {label: "Heading", name: "title", widget: "string"}
                  - {label: "Body", name: "body", widget: "text"}
              - label: "Potentially Compatible"
                name: "conditions"
                widget: "object"
                fields:
                  - {label: "Badge", name: "label", widget: "string"}
                  - {label: "Heading", name: "title", widget: "string"}
                  - {label: "Body", name: "body", widget: "text"}
              - label: "Compatibility Assessment Recommended"
                name: "testing"
                widget: "object"
                fields:
                  - {label: "Badge", name: "label", widget: "string"}
                  - {label: "Heading", name: "title", widget: "string"}
                  - {label: "Body", name: "body", widget: "text"}


  # ── About Us ─────

  - name: "settings"
    label: "Site & SEO Settings"
    files:
      # SITE SETTINGS
      - name: "site"
        label: "Site Settings"
        file: "src/_data/site.yml"
        fields:
          - {label: "Site Name", name: "name", widget: "string"}
          - {label: "Legal Name", name: "legal_name", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - label: "Canonical URL (no trailing slash)"
            name: "url"
            widget: "string"
            pattern: ['^(/|https?://|mailto:|tel:|#)', 'Start with / for a page on this site, for example /contact/. Use https:// for another site, # for a spot on the same page, or mailto: for an email address.']
            hint: "A page on this site starts with a slash and ends with one, like /contact/. Anything else needs its full address starting https://."
          - {label: "Default Meta Description", name: "default_summary", widget: "text"}
          - {label: "Founding Year", name: "founding_year", widget: "string"}
          - {label: "City", name: "locality", widget: "string"}
          - {label: "Country Code", name: "country", widget: "string"}
          - {label: "Contact Email", name: "email", widget: "string"}
          - {label: "Logo", name: "logo", widget: "image"}
          - {label: "CTA panel watermark", name: "cta_mark", widget: "image", required: false, hint: "The faint brand mark in the top right of every green call-to-action panel. Only its shape is used, the colour comes from the panel, so use a flat single-colour graphic on a transparent background. Leave empty for a plain circle."}
          - {label: "Social Profile URLs", name: "social", widget: "list", field: {label: "URL", name: "url", widget: "string"}}
          - label: "Google Search Console token"
            name: "google_site_verification"
            widget: "string"
            required: false
            hint: >
              Only needed once, to claim the site in Google Search Console.
              At search.google.com/search-console choose Add property, then URL
              prefix, enter https://natural-trace.com and pick the HTML tag
              method. Google shows a tag containing content="...". Paste only
              what is inside those quotes, save, wait a couple of minutes for
              the site to rebuild, then press Verify. Leave empty otherwise.
          - {label: "Allow answer engines", name: "allow_answer_engines", widget: "boolean", hint: "Lets ChatGPT, Claude and Perplexity read the site so they can quote it in an answer and link back. These do not train on the content."}
          - {label: "Allow AI training crawlers", name: "allow_ai_training", widget: "boolean", hint: "Lets OpenAI, Anthropic, Google and Common Crawl collect pages to train future AI models. Leave off until the copy claims are signed off: anything used for training cannot be corrected or withdrawn later."}


  # ── SEO: titles and descriptions ─────
      # SEO: page titles and meta descriptions
      - name: "seo"
        label: "SEO: titles and descriptions"
        file: "src/_data/seo.yml"
        fields:
          # "url" is how an entry is matched to a page. It was a free text box,
          # which meant a typo silently detached a page's title and description
          # with nothing to show for it. It is a picker now, so it can only ever
          # be a page that exists.
          - label: "Search engine listings"
            name: "pages"
            widget: "list"
            collapsed: true
            summary: "{{fields.url}}  {{fields.title}}"
            fields:
              - label: "Which page"
                name: "url"
                widget: "select"
                hint: "Pick the page these words describe. If a new page has been added and is not in this list, a developer needs to add it."
                options:
                  - {label: "Home", value: "/"}
                  - {label: "About Us", value: "/about/"}
                  - {label: "NaturalTag", value: "/naturaltag/"}
                  - {label: "NaturalDetect", value: "/naturaldetect/"}
                  - {label: "NaturalCloud", value: "/naturalcloud/"}
                  - {label: "Industries", value: "/industries/"}
                  - {label: "Industry Use-Cases", value: "/industries/use-cases/"}
                  - {label: "FAQ", value: "/faq/"}
                  - {label: "Team", value: "/team/"}
                  - {label: "Careers", value: "/careers/"}
                  - {label: "Insights", value: "/insights/"}
                  - {label: "Assess My Product", value: "/assess/"}
                  - {label: "Contact", value: "/contact/"}
                  - {label: "Privacy Policy", value: "/privacy/"}
              - {label: "Headline in Google results", name: "title", widget: "string", hint: "What someone sees as the blue clickable line on a search results page. Around 60 characters before Google trims it."}
              - {label: "Description in Google results", name: "description", widget: "text", hint: "The grey paragraph under the headline. Aim for 150 to 160 characters: shorter wastes the space, longer gets cut off mid-sentence."}


  # ── Home ─────
      - name: "hubspot"
        label: "HubSpot & Contact Form"
        file: "src/_data/integrations.yml"
        fields:
          - label: "HubSpot"
            name: "hubspot"
            widget: "object"
            hint: "Portal ID and Form GUID are safe to publish. NEVER paste a HubSpot private-app token, access token, or API key here. Everything in this file is visible to the public."
            fields:
              - label: "Send submissions to HubSpot"
                name: "enabled"
                widget: "boolean"
                default: false
                hint: "Only takes effect once Portal ID and Form GUID are both filled in. While off, the form opens the visitor's email client instead."
              - label: "Portal ID (Hub ID)"
                name: "portal_id"
                widget: "string"
                required: false
                hint: "HubSpot: Settings -> Account Management -> Account Defaults."
              - label: "Form GUID"
                name: "form_guid"
                widget: "string"
                required: false
                hint: "HubSpot: Marketing -> Forms -> your form -> Share -> Embed code."
              - label: "Data centre"
                name: "region"
                widget: "select"
                options: ["na1", "na2", "eu1"]
                default: "na1"
                hint: "Natural Trace is on na2. Read it off HubSpot's own embed code, or the app URL: app-eu1 means eu1. Getting this wrong sends enquiries to a region that has never heard of the form."
              - label: "Field mapping"
                name: "field_map"
                widget: "object"
                hint: >
                  These are not labels. Each box holds the name HubSpot uses for
                  that property behind the scenes, which is rarely the same as
                  the name shown on screen. HubSpot calls "Job title" jobtitle,
                  one word, all lowercase. Find any of them in HubSpot under
                  Settings, Properties, Contact properties: open the property
                  and the internal name is shown under its label. A wrong name
                  does not raise an error, that field just stops arriving, so
                  change one only when HubSpot has been changed to match.
                fields:
                  - label: "First name"
                    name: "firstName"
                    widget: "string"
                    required: false
                    pattern: ['^$|^[a-z][a-z0-9_]*$', 'HubSpot internal names are lowercase only, with no spaces. Words run together or are joined by an underscore. Leave empty to stop sending this field.']
                    hint: "HubSpot's standard property is firstname, one word."
                  - label: "Last name"
                    name: "lastName"
                    widget: "string"
                    required: false
                    pattern: ['^$|^[a-z][a-z0-9_]*$', 'HubSpot internal names are lowercase only, with no spaces. Words run together or are joined by an underscore. Leave empty to stop sending this field.']
                    hint: "HubSpot's standard property is lastname, one word."
                  - label: "Email"
                    name: "email"
                    widget: "string"
                    required: false
                    pattern: ['^$|^[a-z][a-z0-9_]*$', 'HubSpot internal names are lowercase only, with no spaces. Words run together or are joined by an underscore. Leave empty to stop sending this field.']
                    hint: "HubSpot's standard property is email."
                  - label: "Company"
                    name: "company"
                    widget: "string"
                    required: false
                    pattern: ['^$|^[a-z][a-z0-9_]*$', 'HubSpot internal names are lowercase only, with no spaces. Words run together or are joined by an underscore. Leave empty to stop sending this field.']
                    hint: "HubSpot's standard property is company."
                  - label: "Job title"
                    name: "jobTitle"
                    widget: "string"
                    required: false
                    pattern: ['^$|^[a-z][a-z0-9_]*$', 'HubSpot internal names are lowercase only, with no spaces. Words run together or are joined by an underscore. Leave empty to stop sending this field.']
                    hint: "HubSpot's standard property is jobtitle, one word, no space and no capital T."
                  - label: "Inquiry type"
                    name: "inquiryType"
                    widget: "string"
                    required: false
                    pattern: ['^$|^[a-z][a-z0-9_]*$', 'HubSpot internal names are lowercase only, with no spaces. Words run together or are joined by an underscore. Leave empty to stop sending this field.']
                    hint: "Not one of HubSpot's own properties. Someone has to create a custom contact property named inquiry_type, or this stays empty and the field is not sent."
                  - label: "Message"
                    name: "message"
                    widget: "string"
                    required: false
                    pattern: ['^$|^[a-z][a-z0-9_]*$', 'HubSpot internal names are lowercase only, with no spaces. Words run together or are joined by an underscore. Leave empty to stop sending this field.']
                    hint: "HubSpot's standard property is message."
          - label: "Email fallback"
            name: "fallback"
            widget: "object"
            hint: "Used when HubSpot is off, unconfigured, or unreachable, so an inquiry is never lost."
            fields:
              - {label: "Inbox address", name: "email", widget: "string"}
              - {label: "Subject prefix", name: "subject_prefix", widget: "string"}
          - label: "Internship applications"
            name: "careers"
            widget: "object"
            hint: "The internship form on the Careers page opens the applicant's email client. This is the address it writes to."
            fields:
              - {label: "Applications go to", name: "internship_email", widget: "string"}
              - {label: "Subject prefix", name: "internship_subject_prefix", widget: "string"}
          - label: "Sitewide Tracking"
            name: "tracking"
            widget: "object"
            fields:
              - {label: "Enabled", name: "enabled", widget: "boolean", hint: "Also needs a HubSpot Portal ID above, and visitor consent"}
          - label: "Cookie Consent Banner"
            name: "consent"
            widget: "object"
            fields:
              - {label: "Show banner", name: "enabled", widget: "boolean"}
              - {label: "Message", name: "message", widget: "text"}
              - {label: "Accept button", name: "accept_label", widget: "string"}
              - {label: "Decline button", name: "decline_label", widget: "string"}
              - {label: "Policy link text", name: "policy_label", widget: "string"}
              - label: "Policy link URL"
                name: "policy_url"
                widget: "string"
                pattern: ['^(/|https?://|mailto:|tel:|#)', 'Start with / for a page on this site, for example /contact/. Use https:// for another site, # for a spot on the same page, or mailto: for an email address.']
                hint: "A page on this site starts with a slash and ends with one, like /contact/. Anything else needs its full address starting https://."

              name: "url"
              widget: "string"
              pattern: ['^(/|https?://|mailto:|tel:|#)', 'Start with / for a page on this site, for example /contact/. Use https:// for another site, # for a spot on the same page, or mailto: for an email address.']
              hint: "A page on this site starts with a slash and ends with one, like /contact/. Anything else needs its full address starting https://."


    # ── Careers ─────

    # Insights: news, updates, and articles
  - name: "insights"
    label: "Insights articles"
    label_singular: "article"
    folder: "src/insights"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["date", "title"]
    media_folder: "/src/assets/images/insights"
    public_folder: "/assets/images/insights"
    fields:
      - {label: "Headline", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime", hint: "Articles are listed newest first. Post-dating one does not hide it."}
      - {label: "Author", name: "author", widget: "string", default: "Natural Trace Team"}
      - {label: "Pin to the top of Insights", name: "pinned", widget: "boolean", default: false, required: false, hint: "Pinned articles sit above the rest regardless of date. Use sparingly, or nothing stands out."}
      - {label: "Header image", name: "image", widget: "image", required: false, hint: "Shown at the top of the article and on its card. Landscape works best, around 1200px wide. A tall or square image is cropped to a banner rather than filling the screen, so it will still look right."}
      - {label: "Header image caption", name: "image_caption", widget: "string", required: false, hint: "Optional line under the header image. Leave empty for no caption."}
      - {label: "Header image description", name: "image_alt", widget: "string", required: false, hint: "For screen readers and for when the image fails to load. Describe what is in the picture. Leave empty and the headline is used."}
      - {label: "Summary", name: "summary", widget: "text", hint: "The paragraph on the article's card. Also used as the Google description unless you set one below."}
      - {label: "Article", name: "body", widget: "markdown"}
      # A fixed list, not a box to type in. It was a free-text list until
      # 2 September 2026, and seventeen tags had accumulated across twenty
      # articles with fifteen of them on exactly one article. "News" was on
      # twelve and narrowed nothing; thirteen of the seventeen existed only to
      # describe two conference write-ups. Tidying the list without closing the
      # field would have bought one clean afternoon: "Nutraceuticals" and
      # "Nutraceutical Authentication" were already both live.
      #
      # Adding an article can no longer add a topic. Adding a topic is editing
      # the options below, which is deliberate and is the point.
      #
      # NEVER REMOVE AN OPTION THAT ARTICLES STILL CARRY. Decap does not show a
      # stored value that is missing from options, so the next person to save
      # that article silently drops its topic. Re-tag first, then remove.
      #
      # The reasoning, the six definitions and what every old tag became are in
      # docs/insights-topics.md.
      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        required: false
        hint: "Pick the one topic this article is mainly about. It shows above the headline on the Insights page and drives the Topic filter there. If none of these fit, the list itself needs changing — ask whoever looks after the website rather than forcing an article into the wrong one."
        options:
          - "Company News"
          - "Industry Events"
          - "Science & Evidence"
          - "Food Fraud"
          - "Ingredient Authenticity"
          - "Regulation"
      - {label: "Google headline (optional)", name: "seo_title", widget: "string", required: false, hint: "Only if the headline above is not what you want appearing in search results. Leave empty to use the headline."}
      - {label: "Google description (optional)", name: "seo_description", widget: "text", required: false, hint: "Only if the summary above is not right for search results. Aim for 150 to 160 characters. Leave empty to use the summary."}


    # ── From our LinkedIn ─────
    #
    # A strip of embedded LinkedIn posts at the foot of the first Insights
    # page. Its own panel rather than part of Insights articles above, because
    # that one is a folder of files with a headline, a body and a web address
    # of its own, and an entry here is a pasted address and a line of
    # description. They are not the same kind of thing and Decap cannot mix the
    # two in one collection anyway.
    #
    # This runs the opposite way to docs/publishing-to-linkedin.md, which
    # pushes articles written here out to LinkedIn. Both directions are wanted:
    # that one is for articles, this one is for the posts that are only ever
    # going to be LinkedIn posts. The walkthrough for whoever is adding one is
    # docs/embedding-linkedin-posts.md.
    #
    # Capped at three. Each entry is an entire LinkedIn page loaded in a frame,
    # and the Insights column is 800px, so three is already past the point
    # where the strip stops being a footnote to the articles above it.
  - name: "linkedin"
    label: "From our LinkedIn"
    files:
      - name: "linkedin"
        label: "From our LinkedIn"
        file: "src/_data/linkedin.yml"
        fields:
          - {label: "Section heading", name: "heading", widget: "string", hint: "The heading above the LinkedIn posts, at the foot of the Insights page."}
          - {label: "Line under the heading", name: "subheading", widget: "string", required: false, hint: "One short sentence saying what these are. Leave it empty and the heading stands on its own."}
          - label: "Posts"
            name: "posts"
            widget: "list"
            max: 3
            summary: "{{fields.title}}"
            hint: "Shown in the order they are in here, so keep the newest at the top. Three is the most that will fit; delete the oldest rather than letting the list grow. With nothing in this list the whole section disappears from the page, which is the right thing to do if there is nothing worth showing. Only posts that anyone can see will work: if a post is set so that only people signed in to LinkedIn can read it, visitors get a sign-in box instead of the post."
            fields:
              - label: "Address of the post"
                name: "url"
                widget: "string"
                pattern: ['^https://(www\.)?linkedin\.com/', 'This needs to be a LinkedIn address starting https://www.linkedin.com/. Open the post itself, click the three dots in its top corner, and choose "Copy link to post".']
                hint: "Open the post on LinkedIn, click the three dots in its top corner, and choose Copy link to post. Paste the whole thing here exactly as it was copied. It has to be a single post, not our company page."
              - {label: "What the post is about", name: "title", widget: "string", hint: "One line. It is read out to anyone using a screen reader, and it is what a visitor sees before deciding to load the post. For example: Our stand at Vitafoods 2026."}


  - name: "contact"
    label: "Contact & Quiz"
    files:
      # CONTACT
      - name: "contact"
        label: "Contact"
        file: "src/_data/contact.yml"
        fields:
          - label: "1. Page introduction"
            name: "intro"
            widget: "object"
            collapsed: true
            hint: "The heading, standfirst and the two blocks of contact detail beside the form."
            fields:
            - {label: "Small label above the heading", name: "label", widget: "string"}
            - {label: "Heading", name: "title", widget: "string"}
            - {label: "Standfirst", name: "subtitle", widget: "text"}
            - label: "Contact detail blocks"
              name: "info_items"
              widget: "list"
              summary: "{{fields.label}}"
              fields:
                - {label: "Label", name: "label", widget: "string"}
                - {label: "Description", name: "description", widget: "text"}

            # The form itself. Every label and placeholder on the contact form is
            # here. Renaming a field is a copy change, not a developer change.

          - label: "2. Enquiry form"
            name: "form"
            widget: "object"
            collapsed: true
            hint: "Every label and placeholder on the form, and the options in its dropdown."
            fields:
            - label: "Labels and placeholders"
              name: "labels"
              widget: "object"
              collapsed: true
              fields:
                - {label: "Form Heading", name: "title", widget: "string"}
                - {label: "Form Intro", name: "subtitle", widget: "text"}
                - {label: "First Name: label", name: "first_name_label", widget: "string"}
                - {label: "First Name: placeholder", name: "first_name_placeholder", widget: "string"}
                - {label: "Last Name: label", name: "last_name_label", widget: "string"}
                - {label: "Last Name: placeholder", name: "last_name_placeholder", widget: "string"}
                - {label: "Email: label", name: "email_label", widget: "string"}
                - {label: "Email: placeholder", name: "email_placeholder", widget: "string"}
                - {label: "Company: label", name: "company_label", widget: "string"}
                - {label: "Company: placeholder", name: "company_placeholder", widget: "string"}
                - {label: "Job Title: label", name: "job_title_label", widget: "string"}
                - {label: "Job Title: placeholder", name: "job_title_placeholder", widget: "string"}
                - {label: "Inquiry Type: label", name: "inquiry_type_label", widget: "string"}
                - {label: "Inquiry Type: placeholder", name: "inquiry_type_placeholder", widget: "string"}
                - {label: "Message: label", name: "message_label", widget: "string"}
                - {label: "Message: placeholder", name: "message_placeholder", widget: "string"}
                - {label: "Submit button", name: "submit_text", widget: "string"}

            # WARNING: "Value sent to HubSpot" is data, not copy. It is written to
            # the inquiry_type property on the contact record. Changing it changes
            # what future enquiries are filed as, and does not rename anything
            # already in HubSpot. Change the visible label freely; change the value
            # only deliberately.
            - label: "Enquiry types"
              name: "types"
              widget: "list"
              summary: "{{fields.label}}"
              fields:
                - {label: "Value sent to HubSpot", name: "value", widget: "string"}
                - {label: "Label shown to the visitor", name: "label", widget: "string"}


          - label: "3. Message after a successful send"
            hint: "Shown when the form reaches HubSpot."
            name: "success"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Heading", name: "title", widget: "string"}
              - {label: "Message", name: "message", widget: "text"}

          # Shown when the enquiry is handed to the visitor's email client
          # instead of going straight to HubSpot.

          - label: "4. Message when the form falls back to email"
            hint: "Shown when the send did not go through but the enquiry can still be emailed."
            name: "fallback"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Heading", name: "title", widget: "string"}
              - {label: "Message", name: "message", widget: "text"}


          - label: "5. Message when the form fails"
            hint: "Shown when the send fails outright."
            name: "error"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Heading", name: "title", widget: "string"}
              - {label: "Message", name: "message", widget: "text"}


          - label: "6. Closing call to action"
            hint: "The last band on the page, above the footer."
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Section Label", name: "section_label", widget: "string"}
              - {label: "Heading", name: "title", widget: "string"}
              - {label: "Background photograph", name: "background_image", widget: "image", required: false, hint: "Blended into the green panel: only its light and shade survive and the colour comes from the panel. A picture with strong shapes works, a pale or busy one disappears. Leave empty for a plain gradient."}
              - {label: "Subcopy", name: "subtitle", widget: "text"}
              - {label: "Primary button text", name: "primary_text", widget: "string"}
              - {label: "Primary button link", name: "primary_href", widget: "string"}
              - {label: "Secondary button text", name: "secondary_text", widget: "string"}
              - {label: "Secondary button link", name: "secondary_href", widget: "string"}


  # ── FAQ ─────
      # ASSESS. The compatibility quiz, moved off the home page on 6 Aug 2026.
      - name: "assess"
        label: "Compatibility Quiz"
        file: "src/_data/assess.yml"
        fields:
          - label: "1. Page introduction"
            name: "intro"
            widget: "object"
            collapsed: true
            hint: "The heading above the quiz on the Assess My Product page."
            fields:
            - {label: "Small label above the heading", name: "label", widget: "string"}
            - {label: "Heading", name: "title", widget: "string"}
            - {label: "Standfirst", name: "subtitle", widget: "text"}

          - label: "2. Start screen"
            name: "welcome"
            widget: "object"
            collapsed: true
            hint: "What a visitor sees before answering anything."
            fields:
            - {label: "Heading", name: "title", widget: "string"}
            - {label: "Description", name: "description", widget: "text"}
            - {label: "Button text", name: "button", widget: "string"}

          - label: "3. The three questions"
            name: "questions"
            widget: "object"
            collapsed: true
            hint: "The wording of each step. The answer options themselves are in section 7."
            fields:
            - {label: "Question 1", name: "step1", widget: "string"}
            - {label: "Question 2", name: "step2", widget: "string"}
            - {label: "Question 2 hint", name: "step2_hint", widget: "string"}
            - {label: "Question 3", name: "step3", widget: "string"}
            - {label: "Question 3: temperature label", name: "step3_temp_label", widget: "string"}
            - {label: "Question 3: pH label", name: "step3_ph_label", widget: "string"}

          - label: "4. Next and Back buttons"
            name: "navigation"
            widget: "object"
            collapsed: true
            hint: "The wording on the two buttons that move between steps."
            fields:
            - {label: "Next button", name: "next", widget: "string"}
            - {label: "Back button", name: "back", widget: "string"}

          - label: "5. Between the last answer and the result"
            name: "confirm"
            widget: "object"
            collapsed: true
            hint: "The short holding screen after the third question."
            fields:
            - {label: "Heading", name: "title", widget: "string", required: false, hint: "No longer shown. Kept so the old wording is not lost if the verdict is ever switched off."}
            - {label: "Description", name: "description", widget: "text", required: false, hint: "No longer shown. See above."}

          - label: "6. The result screen"
            name: "result"
            widget: "object"
            collapsed: true
            hint: "The wording of all three results, plus the note and the button under them. Two of these are registered claims, so check docs/claim-review.yml before rewording a badge or a heading."
            fields:
            - {label: "Button text", name: "cta", widget: "string"}
            - label: "Button link"
              name: "cta_url"
              widget: "string"
              pattern: ['^(/|https?://|mailto:|tel:|#)', 'Start with / for a page on this site, for example /contact/. Use https:// for another site, # for a spot on the same page, or mailto: for an email address.']
              hint: "A page on this site starts with a slash and ends with one, like /contact/. Anything else needs its full address starting https://."
            - {label: "Note under the result", name: "note", widget: "text"}

            # The scoring. These are claims about what NaturalTag tolerates, taken
            # from the NaturalTag Chemical Compatibility Guide v1.2. Changing a
            # band or a risk level changes what the site tells a prospect about
            # their product, so it is not a wording edit.
            - label: "The three results"
              name: "outcomes"
              widget: "object"
              collapsed: true
              fields:
                - label: "Compatible"
                  name: "compatible"
                  widget: "object"
                  fields:
                    - {label: "Badge", name: "label", widget: "string"}
                    - {label: "Heading", name: "title", widget: "string"}
                    - {label: "Body", name: "body", widget: "text"}
                - label: "Potentially Compatible"
                  name: "conditions"
                  widget: "object"
                  fields:
                    - {label: "Badge", name: "label", widget: "string"}
                    - {label: "Heading", name: "title", widget: "string"}
                    - {label: "Body", name: "body", widget: "text"}
                - label: "Compatibility Assessment Recommended"
                  name: "testing"
                  widget: "object"
                  fields:
                    - {label: "Badge", name: "label", widget: "string"}
                    - {label: "Heading", name: "title", widget: "string"}
                    - {label: "Body", name: "body", widget: "text"}


    # ── About Us ─────


          - label: "7. Scoring — changes who sees which result"
            name: "scoring"
            widget: "object"
            collapsed: true
            hint: "Not wording. Editing anything here changes the answer a visitor is given. The pH bands and the 60C threshold come from Compatibility Guide v1.2 and must not be moved without Ying Xiang."
            fields:
            - label: "pH bands"
              name: "ph_options"
              widget: "list"
              label_singular: "band"
              collapsed: true
              summary: "{{fields.label}} — {{fields.risk}}"
              hint: "From section 3.1 of the compatibility guide. Do not change a band without checking it against that document."
              fields:
                - {label: "What the visitor sees", name: "label", widget: "string"}
                - {label: "Risk", name: "risk", widget: "select", options: ["low", "medium", "high"]}
            - label: "Temperature bands"
              name: "temp_options"
              widget: "list"
              label_singular: "band"
              collapsed: true
              summary: "{{fields.label}} — {{fields.risk}}"
              hint: "From section 3.4 of the compatibility guide. 60°C is the threshold that document states."
              fields:
                - {label: "What the visitor sees", name: "label", widget: "string"}
                - {label: "Risk", name: "risk", widget: "select", options: ["low", "medium", "high"]}
            - label: "Risk by product format"
              name: "formulation_risk"
              widget: "object"
              collapsed: true
              hint: "Low, medium or high for each form the quiz offers. These are the old quiz's own rankings re-expressed, and unlike the pH and temperature bands they have no cited source. Changing one changes what the site tells a prospect."
              fields:
                - {label: "Compressed Tablet", name: "tablet", widget: "select", options: ["low", "medium", "high"]}
                - {label: "Hard Capsule", name: "capsule", widget: "select", options: ["low", "medium", "high"]}
                - {label: "Chewable", name: "chewable", widget: "select", options: ["low", "medium", "high"]}
                - {label: "Powder / Sachet", name: "powder", widget: "select", options: ["low", "medium", "high"]}
                - {label: "Effervescent", name: "effervescent", widget: "select", options: ["low", "medium", "high"]}
                - {label: "Drops", name: "drops", widget: "select", options: ["low", "medium", "high"]}
                - {label: "Softgel", name: "softgel", widget: "select", options: ["low", "medium", "high"]}
                - {label: "Bar", name: "bar", widget: "select", options: ["low", "medium", "high"]}
                - {label: "Gummy", name: "gummy", widget: "select", options: ["low", "medium", "high"]}
                - {label: "Liquid / Syrup", name: "liquid", widget: "select", options: ["low", "medium", "high"]}
                - {label: "Lozenge", name: "lozenge", widget: "select", options: ["low", "medium", "high"]}
                - {label: "RTD Beverage", name: "rtd", widget: "select", options: ["low", "medium", "high"]}

          - label: "8. Tested-product evidence"
            name: "evidence"
            widget: "object"
            collapsed: true
            hint: "Real results that override the scoring. Only name a client product here if they have agreed in writing to be named."
            fields:
            - {label: "Wording when we have tested it", name: "yes", widget: "string"}
            - {label: "Wording when we have not", name: "no", widget: "text"}
            - label: "Tested products"
              name: "items"
              widget: "list"
              label_singular: "tested product"
              collapsed: true
              summary: "{{fields.category}} / {{fields.outcome}}"
              hint: "What has actually been through the lab. A row here overrides the pH, temperature and form scoring, because a tested result beats a rule. A pass lifts \"compatible with conditions\" to \"compatible\". A failure drops any answer to \"testing required\", which is deliberately not symmetric: being wrong about a yes costs a client a failed trial, being wrong about a no costs a conversation."
              fields:
                - label: "Product category"
                  name: "category"
                  widget: "select"
                  hint: "Must match a category the quiz offers, or the row will never fire."
                  options:
                    - {label: "Vitamins & Minerals", value: "vitamins"}
                    - {label: "Omega-3 & Fish Oil", value: "omega"}
                    - {label: "Probiotics & Gut Health", value: "probiotics"}
                    - {label: "Joint & Bone", value: "joint"}
                    - {label: "Collagen & Beauty", value: "collagen"}
                    - {label: "Herbal & Botanical", value: "herbal"}
                    - {label: "Sports Nutrition", value: "sports"}
                    - {label: "Immune Support", value: "immune"}
                    - {label: "Weight Management", value: "weight"}
                    - {label: "Specialty Food Ingredients", value: "ingredients"}
                    - {label: "Specialty Health", value: "specialty"}
                    - {label: "Functional Foods", value: "functional"}
                - label: "Product forms tested"
                  name: "forms"
                  widget: "select"
                  multiple: true
                  hint: "Tick every form this result covers. The row fires when a visitor picks any one of them."
                  options:
                    - {label: "Compressed Tablet", value: "tablet"}
                    - {label: "Hard Capsule", value: "capsule"}
                    - {label: "Softgel", value: "softgel"}
                    - {label: "Gummy", value: "gummy"}
                    - {label: "Chewable", value: "chewable"}
                    - {label: "Powder / Sachet", value: "powder"}
                    - {label: "Liquid / Syrup", value: "liquid"}
                    - {label: "Effervescent", value: "effervescent"}
                    - {label: "Lozenge", value: "lozenge"}
                    - {label: "Bar", value: "bar"}
                    - {label: "RTD Beverage", value: "rtd"}
                    - {label: "Drops", value: "drops"}
                - label: "Outcome"
                  name: "outcome"
                  widget: "select"
                  default: "unconfirmed"
                  hint: "Leave on Unconfirmed until someone has the data in front of them. Compatible and Not compatible both change what a prospect is told about their own product."
                  options:
                    - {label: "Unconfirmed — tested, result not to hand", value: "unconfirmed"}
                    - {label: "Compatible — it worked", value: "compatible"}
                    - {label: "Compatible with conditions", value: "conditions"}
                    - {label: "Not compatible — it did not work", value: "not-compatible"}
                - {label: "pH it was tested at", name: "ph", widget: "string", required: false, hint: "Free text, whatever is true. \"5.8\", \"3.2 to 4.1\", \"not measured\"."}
                - {label: "Temperature it was tested at", name: "temperature", widget: "string", required: false, hint: "Free text. \"ambient\", \"up to 80°C\", \"retort, 121°C\"."}
                - {label: "Product name", name: "products", widget: "string", required: false, hint: "OPTIONAL, AND PUBLISHED. This file builds into the live site. Only put a client's product name here if they have agreed to be named."}
                - {label: "Internal note", name: "note", widget: "text", required: false, hint: "Not shown on the site. Accuracy, sample size, anything the next person needs."}

  - name: "event"
    label: "Event QR pages"
    files:
      # EVENT: JAR REVEAL PAGE
      # The page behind the QR code on the physical stand. It is not in the
      # site navigation and not in Google: its only visitors arrive by scanning
      # the code at an event, so every word can assume the reader is standing
      # in front of the two jars right now. One page and one code from 24 Aug;
      # it was a page per jar before that.
      - name: "scan"
        label: "Jar reveal page (IP Week stand)"
        file: "src/_data/scan.yml"
        fields:
          - label: "1. Opening — the top of the page"
            name: "opening"
            widget: "object"
            collapsed: true
            hint: "The first thing someone sees after scanning. Say plainly that one jar carries the tag and the other does not: the printed stand card already shows a tick and a cross, so there is nothing left to keep back."
            fields:
              - {label: "Small label above the headline", name: "label", widget: "string"}
              - {label: "Headline", name: "title", widget: "string", hint: "A question, not an answer. \"Which one is which?\""}
              - {label: "Opening paragraph", name: "lead", widget: "text", hint: "One line, setting up the comparison. The three ways the jars match go in the list below."}
              - {label: "The three ways they match", name: "identical", widget: "list", hint: "One short line each, shown as bullets under the opening paragraph.", field: {label: "Line", name: "line", widget: "string"}}
              - {label: "Closing paragraph", name: "closing", widget: "text", hint: "The point of the comparison: one jar can prove where it came from."}
              - {label: "Photograph of both powders", name: "image", widget: "image", hint: "The two powders together. Square works best here."}
              - {label: "Photograph description", name: "image_alt", widget: "string", hint: "What is in the picture, for anyone using a screen reader. Describe the powders without saying which is which."}

          - label: "2. The two jar cards"
            name: "reveal"
            widget: "object"
            collapsed: true
            hint: "One card per jar, left first then right, matching the order on the stand. Both are shown in full: there is nothing to tap, because the printed card already says which jar is which."
            fields:
              - label: "Left card — the jar on the left"
                name: "left"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Which jar this is", name: "label", widget: "string", hint: "Printed on the photograph. Left jar or Right jar. The cards sit side by side on a computer but stack on a phone, so this is what lets a reader match a picture to a jar on the table."}
                  - {label: "Photograph", name: "image", widget: "image"}
                  - {label: "Photograph description", name: "image_alt", widget: "string", hint: "For screen readers. Describe what the powder looks like, not which jar is authentic, because this shows before the answer does."}
                  - {label: "What it is", name: "title", widget: "string", hint: "Revealed on tap."}
                  - {label: "The line underneath", name: "body", widget: "text"}
              - label: "Right card — the jar on the right"
                name: "right"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Which jar this is", name: "label", widget: "string", hint: "Shown on the card before it is tapped, and kept as a caption after. Left jar or Right jar. The cards sit side by side on a computer but stack on a phone, so this is the only thing telling a reader which pile they are looking at."}
                  - {label: "Photograph", name: "image", widget: "image"}
                  - {label: "Photograph description", name: "image_alt", widget: "string", hint: "For screen readers. Describe the colour, not the identity, because this shows before the answer does."}
                  - {label: "What it is", name: "title", widget: "string", hint: "Revealed on tap."}
                  - {label: "The line underneath", name: "body", widget: "text"}

          - label: "3. First card — why looking is not enough"
            name: "question_title"
            widget: "string"
            hint: "Heading of the left-hand card."
          - label: "First card: text"
            name: "question_body"
            widget: "text"
            hint: "Why looking at the two powders cannot settle it. Both jars hold the same powder as of 25 Aug, so they genuinely do look alike and the copy may say so. Check the jars before writing anything about how they compare. See docs/qr-scan-tracking.md."
          - label: "4. Second card — what we do about it"
            name: "answer_title"
            widget: "string"
            hint: "Heading of the right-hand card."
          - label: "Second card: text"
            name: "answer_body"
            widget: "text"
            hint: "What NaturalTag does. Keep to identity and origin, and keep the assay out of it: this page is read at a stand by someone who wants the proposition, not the method."
          - {label: "Swipe hint", name: "swipe_hint", widget: "string", hint: "Shown under the jar cards and under the evidence cards on a phone only, where those two rows become a side-to-side swipe. Not shown on a computer."}
          - label: "5. Closing call to action"
            name: "cta_heading"
            widget: "string"
            hint: "The question above the button."
          - {label: "Button text", name: "cta_text", widget: "string"}
          - {label: "Button link", name: "cta_url", widget: "string", hint: "Where the button goes. /contact/ unless there is a reason otherwise."}

  - name: "settings"
    label: "Site & SEO Settings"
    files:
      # SITE SETTINGS
      - name: "site"
        label: "Site Settings"
        file: "src/_data/site.yml"
        fields:
          - {label: "Site Name", name: "name", widget: "string"}
          - {label: "Legal Name", name: "legal_name", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - label: "Canonical URL (no trailing slash)"
            name: "url"
            widget: "string"
            pattern: ['^(/|https?://|mailto:|tel:|#)', 'Start with / for a page on this site, for example /contact/. Use https:// for another site, # for a spot on the same page, or mailto: for an email address.']
            hint: "A page on this site starts with a slash and ends with one, like /contact/. Anything else needs its full address starting https://."
          - {label: "Default Meta Description", name: "default_summary", widget: "text"}
          - {label: "Founding Year", name: "founding_year", widget: "string"}
          - {label: "City", name: "locality", widget: "string"}
          - {label: "Country Code", name: "country", widget: "string"}
          - {label: "Contact Email", name: "email", widget: "string"}
          - {label: "Logo", name: "logo", widget: "image"}
          - {label: "CTA panel watermark", name: "cta_mark", widget: "image", required: false, hint: "The faint brand mark in the top right of every green call-to-action panel. Only its shape is used, the colour comes from the panel, so use a flat single-colour graphic on a transparent background. Leave empty for a plain circle."}
          - {label: "Social Profile URLs", name: "social", widget: "list", field: {label: "URL", name: "url", widget: "string"}}
          - label: "Google Search Console token"
            name: "google_site_verification"
            widget: "string"
            required: false
            hint: >
              Only needed once, to claim the site in Google Search Console.
              At search.google.com/search-console choose Add property, then URL
              prefix, enter https://natural-trace.com and pick the HTML tag
              method. Google shows a tag containing content="...". Paste only
              what is inside those quotes, save, wait a couple of minutes for
              the site to rebuild, then press Verify. Leave empty otherwise.
          - {label: "Allow answer engines", name: "allow_answer_engines", widget: "boolean", hint: "Lets ChatGPT, Claude and Perplexity read the site so they can quote it in an answer and link back. These do not train on the content."}
          - {label: "Allow AI training crawlers", name: "allow_ai_training", widget: "boolean", hint: "Lets OpenAI, Anthropic, Google and Common Crawl collect pages to train future AI models. Leave off until the copy claims are signed off: anything used for training cannot be corrected or withdrawn later."}


  # ── SEO: titles and descriptions ─────
      # SEO: page titles and meta descriptions
      - name: "seo"
        label: "SEO: titles and descriptions"
        file: "src/_data/seo.yml"
        fields:
          # "url" is how an entry is matched to a page. It was a free text box,
          # which meant a typo silently detached a page's title and description
          # with nothing to show for it. It is a picker now, so it can only ever
          # be a page that exists.
          - label: "Search engine listings"
            name: "pages"
            widget: "list"
            collapsed: true
            summary: "{{fields.url}}  {{fields.title}}"
            fields:
              - label: "Which page"
                name: "url"
                widget: "select"
                hint: "Pick the page these words describe. If a new page has been added and is not in this list, a developer needs to add it."
                options:
                  - {label: "Home", value: "/"}
                  - {label: "About Us", value: "/about/"}
                  - {label: "NaturalTag", value: "/naturaltag/"}
                  - {label: "NaturalDetect", value: "/naturaldetect/"}
                  - {label: "NaturalCloud", value: "/naturalcloud/"}
                  - {label: "Industries", value: "/industries/"}
                  - {label: "Industries: Nutraceuticals & Dietary Supplements", value: "/industries/nutraceuticals/"}
                  - {label: "Industries: Branded Ingredients", value: "/industries/branded-ingredients/"}
                  - {label: "Industries: Functional Foods", value: "/industries/functional-foods/"}
                  - {label: "Industries: Agri-food", value: "/industries/agri-food/"}
                  - {label: "Industry Use-Cases", value: "/industries/use-cases/"}
                  - {label: "FAQ", value: "/faq/"}
                  - {label: "Team", value: "/team/"}
                  - {label: "Careers", value: "/careers/"}
                  - {label: "Insights", value: "/insights/"}
                  - {label: "Assess My Product", value: "/assess/"}
                  - {label: "Contact", value: "/contact/"}
                  - {label: "Privacy Policy", value: "/privacy/"}
              - {label: "Headline in Google results", name: "title", widget: "string", hint: "What someone sees as the blue clickable line on a search results page. Around 60 characters before Google trims it."}
              - {label: "Description in Google results", name: "description", widget: "text", hint: "The grey paragraph under the headline. Aim for 150 to 160 characters: shorter wastes the space, longer gets cut off mid-sentence."}


  # ── Home ─────
      - name: "hubspot"
        label: "HubSpot & Contact Form"
        file: "src/_data/integrations.yml"
        fields:
          - label: "HubSpot"
            name: "hubspot"
            widget: "object"
            hint: "Portal ID and Form GUID are safe to publish. NEVER paste a HubSpot private-app token, access token, or API key here. Everything in this file is visible to the public."
            fields:
              - label: "Send submissions to HubSpot"
                name: "enabled"
                widget: "boolean"
                default: false
                hint: "Only takes effect once Portal ID and Form GUID are both filled in. While off, the form opens the visitor's email client instead."
              - label: "Portal ID (Hub ID)"
                name: "portal_id"
                widget: "string"
                required: false
                hint: "HubSpot: Settings -> Account Management -> Account Defaults."
              - label: "Form GUID"
                name: "form_guid"
                widget: "string"
                required: false
                hint: "HubSpot: Marketing -> Forms -> your form -> Share -> Embed code."
              - label: "Data centre"
                name: "region"
                widget: "select"
                options: ["na1", "na2", "eu1"]
                default: "na1"
                hint: "Natural Trace is on na2. Read it off HubSpot's own embed code, or the app URL: app-eu1 means eu1. Getting this wrong sends enquiries to a region that has never heard of the form."
              - label: "Field mapping"
                name: "field_map"
                widget: "object"
                hint: >
                  These are not labels. Each box holds the name HubSpot uses for
                  that property behind the scenes, which is rarely the same as
                  the name shown on screen. HubSpot calls "Job title" jobtitle,
                  one word, all lowercase. Find any of them in HubSpot under
                  Settings, Properties, Contact properties: open the property
                  and the internal name is shown under its label. A wrong name
                  does not raise an error, that field just stops arriving, so
                  change one only when HubSpot has been changed to match.
                fields:
                  - label: "First name"
                    name: "firstName"
                    widget: "string"
                    required: false
                    pattern: ['^$|^[a-z][a-z0-9_]*$', 'HubSpot internal names are lowercase only, with no spaces. Words run together or are joined by an underscore. Leave empty to stop sending this field.']
                    hint: "HubSpot's standard property is firstname, one word."
                  - label: "Last name"
                    name: "lastName"
                    widget: "string"
                    required: false
                    pattern: ['^$|^[a-z][a-z0-9_]*$', 'HubSpot internal names are lowercase only, with no spaces. Words run together or are joined by an underscore. Leave empty to stop sending this field.']
                    hint: "HubSpot's standard property is lastname, one word."
                  - label: "Email"
                    name: "email"
                    widget: "string"
                    required: false
                    pattern: ['^$|^[a-z][a-z0-9_]*$', 'HubSpot internal names are lowercase only, with no spaces. Words run together or are joined by an underscore. Leave empty to stop sending this field.']
                    hint: "HubSpot's standard property is email."
                  - label: "Company"
                    name: "company"
                    widget: "string"
                    required: false
                    pattern: ['^$|^[a-z][a-z0-9_]*$', 'HubSpot internal names are lowercase only, with no spaces. Words run together or are joined by an underscore. Leave empty to stop sending this field.']
                    hint: "HubSpot's standard property is company."
                  - label: "Job title"
                    name: "jobTitle"
                    widget: "string"
                    required: false
                    pattern: ['^$|^[a-z][a-z0-9_]*$', 'HubSpot internal names are lowercase only, with no spaces. Words run together or are joined by an underscore. Leave empty to stop sending this field.']
                    hint: "HubSpot's standard property is jobtitle, one word, no space and no capital T."
                  - label: "Inquiry type"
                    name: "inquiryType"
                    widget: "string"
                    required: false
                    pattern: ['^$|^[a-z][a-z0-9_]*$', 'HubSpot internal names are lowercase only, with no spaces. Words run together or are joined by an underscore. Leave empty to stop sending this field.']
                    hint: "Not one of HubSpot's own properties. Someone has to create a custom contact property named inquiry_type, or this stays empty and the field is not sent."
                  - label: "Message"
                    name: "message"
                    widget: "string"
                    required: false
                    pattern: ['^$|^[a-z][a-z0-9_]*$', 'HubSpot internal names are lowercase only, with no spaces. Words run together or are joined by an underscore. Leave empty to stop sending this field.']
                    hint: "HubSpot's standard property is message."
          - label: "Email fallback"
            name: "fallback"
            widget: "object"
            hint: "Used when HubSpot is off, unconfigured, or unreachable, so an inquiry is never lost."
            fields:
              - {label: "Inbox address", name: "email", widget: "string"}
              - {label: "Subject prefix", name: "subject_prefix", widget: "string"}
          - label: "Internship applications"
            name: "careers"
            widget: "object"
            hint: "The internship form on the Careers page opens the applicant's email client. This is the address it writes to."
            fields:
              - {label: "Applications go to", name: "internship_email", widget: "string"}
              - {label: "Subject prefix", name: "internship_subject_prefix", widget: "string"}
          - label: "Sitewide Tracking"
            name: "tracking"
            widget: "object"
            fields:
              - {label: "Enabled", name: "enabled", widget: "boolean", hint: "Also needs a HubSpot Portal ID above, and visitor consent"}
          - label: "Cloudflare Web Analytics"
            name: "cloudflare_analytics"
            widget: "object"
            hint: "Counts page views across the whole site. Unlike the HubSpot tracking above it sets no cookies, so it runs without the consent banner and therefore sees everyone rather than only the people who tap Accept. That is the point of it."
            fields:
              - {label: "Enabled", name: "enabled", widget: "boolean", hint: "Also needs the site token below. With no token nothing loads at all."}
              - {label: "Site token", name: "token", widget: "string", required: false, hint: "From dash.cloudflare.com, Web Analytics, Add a site. It is published in the page and is not a secret; it is not an API key and grants nothing."}
          - label: "PostHog Analytics"
            name: "posthog"
            widget: "object"
            hint: "Records which pages are read and what gets clicked, including on the compatibility quiz. Until a visitor taps Accept on the cookie banner it sets no cookie and counts them anonymously; after Accept it can also record their session. Setup, and the privacy policy wording that has to go with it, is in docs/posthog-setup.md."
            fields:
              - {label: "Enabled", name: "enabled", widget: "boolean", default: false, hint: "Also needs the project token below. With no token nothing loads at all. Do not switch on before the privacy policy names PostHog."}
              - {label: "Project token", name: "token", widget: "string", required: false, hint: "PostHog: Settings, Project, Project API key. Starts with phc_. It is published in the page and is not a secret; it is not a personal API key and grants nothing."}
              - {label: "Data region", name: "region", widget: "select", options: ["eu", "us"], default: "eu", hint: "Where PostHog keeps the data. Must match where the project was created: eu for eu.posthog.com, us for us.posthog.com. Getting it wrong sends events to a region that has never heard of the project."}
          - label: "Cookie Consent Banner"
            name: "consent"
            widget: "object"
            fields:
              - {label: "Show banner", name: "enabled", widget: "boolean"}
              - {label: "Message", name: "message", widget: "text"}
              - {label: "Accept button", name: "accept_label", widget: "string"}
              - {label: "Decline button", name: "decline_label", widget: "string"}
              - {label: "Policy link text", name: "policy_label", widget: "string"}
              - label: "Policy link URL"
                name: "policy_url"
                widget: "string"
                pattern: ['^(/|https?://|mailto:|tel:|#)', 'Start with / for a page on this site, for example /contact/. Use https:// for another site, # for a spot on the same page, or mailto: for an email address.']
                hint: "A page on this site starts with a slash and ends with one, like /contact/. Anything else needs its full address starting https://."
